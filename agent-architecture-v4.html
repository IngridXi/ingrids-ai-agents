<meta charset="UTF-8">

<title>Ingrid's AI Agents · 动态架构图 v4</title>
<style>
  :root{
    --bg:#f6f6f3; --panel:#ffffff; --ink:#1f1f1f; --muted:#8a8a86; --line:#e4e4e0;
    --blue:#185FA5; --purple:#534AB7; --red:#A32D2D;
    --amber:#BA7517; --gray:#5F5E5A; --coral:#C04A3A; --green:#0F6E56;
    --accent:#185FA5;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;font-size:14px;}

  /* ===== 顶栏 ===== */
  #topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:10px 16px;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  #topbar .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px;white-space:nowrap;}
  #topbar .brand .dot{width:10px;height:10px;border-radius:3px;background:linear-gradient(135deg,var(--blue),var(--purple));}
  #topbar .brand .sub{font-weight:400;color:var(--muted);font-size:12px;margin-left:2px;}
  .ctrl{display:flex;align-items:center;gap:6px;}
  .seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;}
  .seg button{border:none;background:transparent;padding:5px 11px;border-radius:7px;font-size:12.5px;color:var(--muted);cursor:pointer;font-weight:600;}
  .seg button.active{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12);}
  .seg button.active.v-network{color:var(--blue);}
  .seg button.active.v-tree{color:var(--purple);}
  .seg button:hover{color:var(--ink);}
  #search{width:150px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;background:var(--panel);outline:none;}
  #search:focus{border-color:var(--accent);}
  .btn{border:1px solid var(--line);background:var(--panel);padding:6px 11px;border-radius:8px;font-size:12.5px;color:var(--ink);cursor:pointer;font-weight:600;}
  .btn:hover{background:#f2f2ef;}
  .hint{font-size:11.5px;color:var(--muted);margin-left:auto;white-space:nowrap;}

  /* ===== 画布 ===== */
  #cv{position:fixed;inset:0;display:block;cursor:grab;}
  #cv.grabbing{cursor:grabbing;}
  #cv.pointer{cursor:pointer;}

  /* ===== 图例 ===== */
  #legend{position:fixed;left:16px;bottom:16px;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);
    border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:7px;}
  #legend .lg-row{display:flex;align-items:center;gap:8px;}
  #legend .sw{width:11px;height:11px;border-radius:50%;flex:none;display:inline-block;}
  #legend .sw.sq{border-radius:3px;}
  #legend b{color:var(--ink);font-weight:600;}
  #legend .lg-title{font-weight:700;color:var(--ink);font-size:12px;margin-bottom:1px;}

  /* ===== 工具提示 ===== */
  #tip{position:fixed;display:none;z-index:40;max-width:320px;background:#1f1f1f;color:#f5f5f2;border-radius:10px;

  #tip .tt{font-weight:700;font-size:12.5px;margin-bottom:4px;display:block;}
  #tip ul{margin:0;padding-left:16px;} #tip li{margin:1px 0;}

  /* ===== 抽屉 ===== */
  #mask{position:fixed;inset:0;background:rgba(20,20,20,.35);z-index:50;display:none;}
  #drawer{position:fixed;top:0;right:0;height:100%;width:470px;max-width:94vw;background:#fff;z-index:60;box-shadow:-12px 0 40px rgba(0,0,0,.18);
    transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;}
  #drawer.open{transform:translateX(0);}
  #drawer .d-head{padding:18px 20px 14px;border-bottom:1px solid var(--line);position:relative;}
  #drawer .d-head .d-emoji{font-size:26px;}
  #drawer .d-head h2{margin:6px 0 2px;font-size:18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  #drawer .d-head .d-sub{color:var(--muted);font-size:12.5px;margin-top:2px;}
  #drawer .d-head .d-tag{font-size:11px;font-weight:700;color:#fff;border-radius:20px;padding:2px 10px;}
  #drawer .d-body{flex:1;overflow-y:auto;padding:16px 20px 30px;}
  #drawer .d-sec{margin-bottom:18px;}
  #drawer .d-sec h3{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin:0 0 8px;}
  #drawer ol{margin:0;padding-left:18px;} #drawer ol li{font-size:13px;margin:3px 0;}
  .flow-item{display:flex;gap:10px;align-items:flex-start;font-size:13px;margin:6px 0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#FAFAF8;}
  .flow-dir{flex:none;font-weight:700;font-size:11px;border-radius:5px;padding:2px 7px;color:#fff;}
  .dir-up{background:var(--green);} .dir-down{background:var(--blue);} .dir-both{background:var(--purple);} .dir-ext{background:var(--red);}
  .chip{display:inline-block;font-size:11px;background:var(--bg);color:#5f5e5a;border-radius:20px;padding:2px 9px;margin:2px 4px 2px 0;}
  #drawer .d-close{position:absolute;top:12px;right:14px;width:32px;height:32px;border:none;background:var(--bg);border-radius:8px;cursor:pointer;font-size:16px;color:#5f5e5a;}
</style>
</head>

/* ================= 数据建模 ================= */
var levelColor = {1:'#185FA5',2:'#A32D2D',3:'#534AB7'};
var typeColor  = {active:'#BA7517', chain:'#5F5E5A', gap:'#C04A3A', manual:'#0F6E56'};
var typeLabel  = {active:'主动', chain:'链路', gap:'缺口', manual:'人工'};
var levelName  = {1:'一级 · 工作台底座', 2:'二级 · 总控 chief', 3:'三级 · 项目层 CityVerse'};

var NODES = [], byName = {};
SECTIONS.forEach(function(sec, si){
  var lvl = (sec.num==='一级')?1:(sec.num==='二级')?3:2;
  sec.groups.forEach(function(g, gi){
    g.cards.forEach(function(a){
      var nd = { key:a.n, lvl:lvl, si:si, gi:gi,
        e:a.e, n:a.n, tag:a.t, tagC:a.tagC, type:a.type, kind:a.kind||'agent',
        task:a.task, eng:a.eng, engNote:a.engNote, resp:a.resp, detail:a.detail,
        x:0,y:0,vx:0,vy:0,r:8,deg:0,pin:false,neighbors:[] };
      NODES.push(nd); byName[a.n]=nd;
    });
  });
});

var ELINKS = [];
EDGES.forEach(function(e){
  var s=byName[e[0]], t=byName[e[1]];
  if(s && t){ s.deg++; t.deg++; ELINKS.push({s:s,t:t,d:e[2]}); }
});
// 邻接表（含双向）
ELINKS.forEach(function(ln){
  ln.s.neighbors.push(ln.t); ln.t.neighbors.push(ln.s);
});

// 簇：si-gi
var clusters = {};
NODES.forEach(function(nd){ var k=nd.si+'-'+nd.gi; (clusters[k]=clusters[k]||[]).push(nd); });

function zoneTitle(nd){
  var map = {
    '0-0':'治理层','0-1':'前台','0-2':'后台子','0-3':'悬浮助手',
    '1-0':'ops 运营','1-1':'intel 建设','1-2':'strategy 战略',
    '2-0':'调度结构','2-1':'执行层 worker'
  };
  return map[nd.si+'-'+nd.gi]||'';
}

var W=1200, H=1000;
var levelX = {1:190, 2:620, 3:1040};   // 树状图（横向）用
var levelY = {1:185, 2:505, 3:850};     // 网络图（纵向分带）用
var groupX = {1:[190,490,790,1040], 2:[470,760], 3:[300,620,940]};
var ZONES = [
  {lvl:1, x1:50, y1:62,  x2:1150, y2:308},
  {lvl:2, x1:50, y1:392, x2:1150, y2:630},
  {lvl:3, x1:50, y1:718, x2:1150, y2:972}
];
var clusterAnchors = {};
(function(){
  Object.keys(clusters).forEach(function(k){
    var nd0 = clusters[k][0];
    var lvl = nd0.lvl;
    var keys = Object.keys(clusters).filter(function(k2){return clusters[k2][0].lvl===lvl;}).sort();
    var idx = keys.indexOf(k);
    clusterAnchors[k] = {x: groupX[lvl][idx], y: levelY[lvl]};
  });
})();

function initForce(){
  Object.keys(clusters).forEach(function(k){
    var an = clusterAnchors[k];
    clusters[k].forEach(function(nd, i){
      var ang = Math.random()*Math.PI*2, rad = Math.random()*55;
      nd.x = an.x + Math.cos(ang)*rad; nd.y = an.y + Math.sin(ang)*rad;
      nd.vx=0; nd.vy=0;
    });
  });
  heat(420);
}

/* ================= 物理 ================= */
var running=false, simTicks=0;
function heat(n){ running=true; simTicks=Math.max(simTicks, n||260); }
function physics(){
  var i,j;
  for(i=0;i<NODES.length;i++){ var a=NODES[i];
    for(j=i+1;j<NODES.length;j++){ var b=NODES[j];
      var dx=b.x-a.x, dy=b.y-a.y; var d2=dx*dx+dy*dy; if(d2<1)d2=1; var d=Math.sqrt(d2);
      if(d<170){ var f=(170-d)/170*1.7; var ux=dx/d*f, uy=dy/d*f; a.vx-=ux; a.vy-=uy; b.vx+=ux; b.vy+=uy; }
    }
  }
  ELINKS.forEach(function(ln){
    var dx=ln.t.x-ln.s.x, dy=ln.t.y-ln.s.y; var d=Math.sqrt(dx*dx+dy*dy)||1;
    var f=(d-92)*0.022; var ux=dx/d*f, uy=dy/d*f;
    ln.s.vx+=ux; ln.s.vy+=uy; ln.t.vx-=ux; ln.t.vy-=uy;
  });
  Object.keys(clusters).forEach(function(k){
    var c=clusters[k], an=clusterAnchors[k];
    c.forEach(function(n){ var dx=an.x-n.x, dy=an.y-n.y; n.vx+=dx*0.004; n.vy+=dy*0.004; });
  });
  /* 分带布局：不设全局中心引力，靠簇锚点定位，避免层级间纵向串扰 */
  NODES.forEach(function(n){
    if(n.pin){ n.vx=0; n.vy=0; return; }
    n.vx*=0.82; n.vy*=0.82; n.x+=n.vx; n.y+=n.vy;
  });
}

/* ================= 树状布局 ================= */
function setTreeLayout(){
  running=false;
  var order = Object.keys(clusters).sort(function(a,b){ var ca=clusters[a][0],cb=clusters[b][0]; return (ca.lvl-cb.lvl)||(ca.si-cb.si)||(ca.gi-cb.gi); });
  var byLevel={}; order.forEach(function(k){ var l=clusters[k][0].lvl; (byLevel[l]=byLevel[l]||[]).push(k); });
  [1,2,3].forEach(function(l){
    var keys=byLevel[l]||[];
    var totalH=0; keys.forEach(function(k){ totalH += (clusters[k].length-1)*33 + 74; });
    var y0 = H/2 - totalH/2;
    keys.forEach(function(k){
      var c=clusters[k].slice().sort(function(a,b){ return a.n<b.n?-1:1; });
      var grpH=(c.length-1)*33;
      c.forEach(function(nd,ii){ nd.x=levelX[l]; nd.y=y0+grpH/2+ii*33; nd.vx=0; nd.vy=0; });
      y0 += grpH + 74;
    });
  });
  fit();
}

/* ================= 渲染 ================= */
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var DPR=1;
var view={tx:0,ty:0,k:1};
var mode='force';
var hoverNode=null, neighborSet=null;
var filterLvl='', searchQ='';
var needsRender=true;

function resize(){
  DPR = window.devicePixelRatio||1;
  cv.width = window.innerWidth*DPR; cv.height = window.innerHeight*DPR;
  cv.style.width = window.innerWidth+'px'; cv.style.height = window.innerHeight+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  fit();
}
window.addEventListener('resize', function(){ resize(); needsRender=true; });

function fit(){
  if(!NODES.length) return;
  var minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
  NODES.forEach(function(n){ minx=Math.min(minx,n.x);maxx=Math.max(maxx,n.x);miny=Math.min(miny,n.y);maxy=Math.max(maxy,n.y); });
  if(mode==='force'){ ZONES.forEach(function(z){ minx=Math.min(minx,z.x1);maxx=Math.max(maxx,z.x2);miny=Math.min(miny,z.y1);maxy=Math.max(maxy,z.y2); }); }
  var bw=Math.max(maxx-minx,200), bh=Math.max(maxy-miny,200);
  var cw=window.innerWidth, ch=window.innerHeight;
  var k=Math.min(cw/bw, ch/bh)*0.88; k=Math.max(0.3, Math.min(2.2, k));
  view.k=k;
  view.tx = cw/2 - ((minx+maxx)/2)*k;
  view.ty = ch/2 - ((miny+maxy)/2)*k;
  needsRender=true;
}

function wx(sx){ return (sx-view.tx)/view.k; }
function wy(sy){ return (sy-view.ty)/view.k; }
function sx(wx){ return wx*view.k+view.tx; }
function sy(wy){ return wy*view.k+view.ty; }

function dimNode(nd){
  if(searchQ && nd.n.indexOf(searchQ)<0) return true;
  if(filterLvl!=='' && nd.lvl!==filterLvl) return true;
  if(hoverNode && nd!==hoverNode && neighborSet && neighborSet.indexOf(nd)<0) return true;
  return false;
}
function nodeAlpha(nd){ return dimNode(nd)?0.13:1; }

function hexToRgba(hex, a){
  var h = hex.replace('#','');
  var r=parseInt(h.substr(0,2),16), g=parseInt(h.substr(2,2),16), b=parseInt(h.substr(4,2),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}
function roundRect(x,y,w,h,r){
  r=Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function countByLevel(lvl){ var c=0; NODES.forEach(function(n){ if(n.lvl===lvl)c++; }); return c; }
function drawZones(){
  ZONES.forEach(function(z){
    var x1=sx(z.x1), y1=sy(z.y1), x2=sx(z.x2), y2=sy(z.y2);
    var w=x2-x1, h=y2-y1;
    ctx.fillStyle = hexToRgba(levelColor[z.lvl], 0.05);
    roundRect(x1,y1,w,h,18); ctx.fill();
    ctx.strokeStyle = hexToRgba(levelColor[z.lvl], 0.20);
    ctx.lineWidth = 1; roundRect(x1,y1,w,h,18); ctx.stroke();
    ctx.font = '700 13px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillStyle = levelColor[z.lvl];
    ctx.fillText(levelName[z.lvl]+' · '+countByLevel(z.lvl)+' 个', x1+16, y1+13);
  });
}

function draw(){
  ctx.clearRect(0,0,cv.width/DPR, cv.height/DPR);
  // 背景
  ctx.fillStyle='#f6f6f3'; ctx.fillRect(0,0,cv.width/DPR,cv.height/DPR);
  // 点阵
  ctx.fillStyle='rgba(0,0,0,0.035)';
  var gs=42; var ox=(view.tx%gs), oy=(view.ty%gs);
  for(var x=ox; x<cv.width/DPR; x+=gs) for(var y=oy; y<cv.height/DPR; y+=gs){ ctx.fillRect(x,y,1,1); }

  if(mode==='force'){ drawZones(); }

  ctx.save();
  ctx.translate(view.tx, view.ty); ctx.scale(view.k, view.k);

  // 边
  ELINKS.forEach(function(ln){
    var da = dimNode(ln.s), db = dimNode(ln.t);
    var isHi = hoverNode && (ln.s===hoverNode || ln.t===hoverNode);
    if(da||db){ if(!isHi){ return; } }
    var a = isHi?0.95:(da||db?0.06:0.5);
    ctx.strokeStyle = isHi? levelColor[ln.s.lvl] : '#b9b9b2';
    ctx.globalAlpha = a;
    ctx.lineWidth = isHi?2.2:1.2;
    ctx.beginPath(); ctx.moveTo(ln.s.x, ln.s.y); ctx.lineTo(ln.t.x, ln.t.y); ctx.stroke();
    if(ln.d===0){ // 箭头
      var ang=Math.atan2(ln.t.y-ln.s.y, ln.t.x-ln.s.x);
      var rx=ln.t.r+3;
      var ex=ln.t.x-Math.cos(ang)*rx, ey=ln.t.y-Math.sin(ang)*rx;
      ctx.fillStyle = isHi? levelColor[ln.s.lvl] : '#b9b9b2';
      ctx.beginPath();
      ctx.moveTo(ex,ey);
      ctx.lineTo(ex-7*Math.cos(ang-0.4), ey-7*Math.sin(ang-0.4));
      ctx.lineTo(ex-7*Math.cos(ang+0.4), ey-7*Math.sin(ang+0.4));
      ctx.closePath(); ctx.fill();
    }
  });
  ctx.globalAlpha=1;

  // 节点
  NODES.forEach(function(nd){
    var a=nodeAlpha(nd);
    if(a<0.2 && !hoverNode) return;
    var isHi = (nd===hoverNode) || (hoverNode && neighborSet && neighborSet.indexOf(nd)>=0);
    ctx.globalAlpha = a;
    var r = nd.r;
    var isRes = (nd.kind==='res');
    if(isHi){
      ctx.beginPath();
      if(isRes){ roundRect(nd.x-r-7, nd.y-r-7, (r+7)*2, (r+7)*2, 9); }
      else { ctx.arc(nd.x,nd.y,r+7,0,Math.PI*2); }
      ctx.fillStyle='rgba(24,95,165,0.10)'; ctx.fill();
    }
    if(isRes){
      // 资源/能力底座 → 方形虚线，区别于 Agent 圆点
      var s=r*1.5;
      roundRect(nd.x-s/2, nd.y-s/2, s, s, 7);
      ctx.fillStyle='#f4f3ee';
      ctx.fill();
      ctx.lineWidth=(isHi?2.5:1.5);
      ctx.strokeStyle='#8A8A86';
      ctx.setLineDash(isHi?[]:[4,3]);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.font=(s*0.52)+'px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle='#5b5b55';
      ctx.fillText(nd.e, nd.x, nd.y+1);
    } else {
      ctx.beginPath(); ctx.arc(nd.x,nd.y,r,0,Math.PI*2);
      ctx.fillStyle = levelColor[nd.lvl];
      ctx.fill();
      ctx.lineWidth = (isHi?2.5:1.5);
      ctx.strokeStyle = isHi? levelColor[nd.lvl] : '#ffffff';
      ctx.stroke();
      // 触发类型圆点
      var tc=typeColor[nd.type];
      ctx.beginPath(); ctx.arc(nd.x+r*0.72, nd.y-r*0.72, 3.6, 0, Math.PI*2);
      ctx.fillStyle=tc; ctx.fill(); ctx.lineWidth=1; ctx.strokeStyle='#fff'; ctx.stroke();
    }
    ctx.globalAlpha=1;
  });
  ctx.restore();

  // 簇标题（浅色小胶囊，标识组名）
  if(mode==='force'){
    Object.keys(clusters).forEach(function(k){
      var an=clusterAnchors[k]; var nd0=clusters[k][0];
      var X=sx(an.x), Y=sy(an.y);
      var label = zoneTitle(nd0)+' · '+clusters[k].length;
      ctx.font='600 10.5px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif';
      var tw = ctx.measureText(label).width;
      var px=X-tw/2-9, py=Y-52, pw=tw+18, ph=20;
      ctx.fillStyle='rgba(255,255,255,0.85)';
      roundRect(px,py,pw,ph,10); ctx.fill();
      ctx.strokeStyle=hexToRgba(levelColor[nd0.lvl],0.28); ctx.lineWidth=1;
      roundRect(px,py,pw,ph,10); ctx.stroke();
      ctx.fillStyle=levelColor[nd0.lvl];
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(label, X, py+ph/2+0.5);
    });
  }

  // 标签（屏幕空间 + 多方位放置，尽量保证每个节点都标上名字）
  ctx.font='11px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif';
  var drawn=[];
  var order=NODES.slice().sort(function(a,b){return b.deg-a.deg;});
  order.forEach(function(nd){
    var a=nodeAlpha(nd);
    if(a<0.2) return;
    var rr=nd.r*view.k;
    var X0=sx(nd.x), Y0=sy(nd.y);
    var txt=(nd.kind==='res')? nd.n : (nd.e+' '+nd.n);
    var w=ctx.measureText(txt).width;
    // 候选位置：下 / 上 / 右 / 左
    var cand=[
      {align:'center', base:'top',    x:X0,       y:Y0+rr+5,   rect:{x:X0-w/2-3,        y:Y0+rr+5,       w:w+6, h:15}},
      {align:'center', base:'bottom', x:X0,       y:Y0-rr-5,   rect:{x:X0-w/2-3,        y:Y0-rr-5-15,    w:w+6, h:15}},
      {align:'left',   base:'middle', x:X0+rr+5,  y:Y0,        rect:{x:X0+rr+5-3,       y:Y0-7,          w:w+6, h:15}},
      {align:'right',  base:'middle', x:X0-rr-5,  y:Y0,        rect:{x:X0-rr-5-w-3,     y:Y0-7,          w:w+6, h:15}}
    ];
    var chosen=null;
    for(var p=0;p<cand.length;p++){
      var c=cand[p], overlap=false;
      for(var i=0;i<drawn.length;i++){ var r2=drawn[i];
        if(c.rect.x<r2.x+r2.w && c.rect.x+c.rect.w>r2.x && c.rect.y<r2.y+r2.h && c.rect.y+c.rect.h>r2.y){ overlap=true; break; }
      }
      if(!overlap){ chosen=c; break; }
    }
    if(!chosen) return;
    drawn.push(chosen.rect);
    var isHi = (nd===hoverNode);
    ctx.globalAlpha = isHi?1:a;
    ctx.fillStyle = (nd.kind==='res') ? '#5b5b55' : (isHi? levelColor[nd.lvl] : '#3a3a36');
    ctx.font = isHi?'700 12px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif':'11px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif';
    ctx.textAlign=chosen.align; ctx.textBaseline=chosen.base;
    ctx.fillText(txt, chosen.x, chosen.y);
    ctx.globalAlpha=1;
  });
}

/* ================= 交互 ================= */
var dragging=null, panning=false, downX=0, downY=0, moved=0, downNode=null;

cv.addEventListener('mousedown', function(e){
  var r=cv.getBoundingClientRect(); var mx=e.clientX-r.left, my=e.clientY-r.top;
  var nd=hitNode(mx,my);
  downX=mx; downY=my; moved=0; downNode=nd;
  if(nd){ dragging=nd; nd.pin=true; cv.classList.add('pointer'); }
  else { panning=true; cv.classList.add('grabbing'); }
});
window.addEventListener('mousemove', function(e){
  var r=cv.getBoundingClientRect(); var mx=e.clientX-r.left, my=e.clientY-r.top;
  if(dragging){
    dragging.x=wx(mx); dragging.y=wy(my); heat(60); needsRender=true;
    return;
  }
  if(panning){
    var dx=mx-downX, dy=my-downY; moved+=Math.abs(dx)+Math.abs(dy);
    view.tx+=dx; view.ty+=dy; downX=mx; downY=my; needsRender=true;
    return;
  }
  var nd=hitNode(mx,my);
  if(nd!==hoverNode){ hoverNode=nd; neighborSet = nd?nd.neighbors:null; cv.classList.toggle('pointer',!!nd); needsRender=true; }
  if(nd){ showTip(e,nd); } else { hideTip(); }
});
window.addEventListener('mouseup', function(e){
  if(dragging){ dragging.pin=false; dragging=null; heat(180); }
  if(panning){ panning=false; cv.classList.remove('grabbing'); }
  if(moved<5 && downNode){ openDrawer(downNode); }
  downNode=null; needsRender=true;
});
cv.addEventListener('wheel', function(e){
  e.preventDefault();
  var r=cv.getBoundingClientRect(); var mx=e.clientX-r.left, my=e.clientY-r.top;
  var factor = e.deltaY<0?1.1:0.9;
  var k2=view.k*factor; k2=Math.max(0.25,Math.min(4,k2));
  var wxx=wx(mx), wyy=wy(my);
  view.tx=mx-wxx*k2; view.ty=my-wyy*k2; view.k=k2;
  needsRender=true;
},{passive:false});

function hitNode(mx,my){
  for(var i=0;i<NODES.length;i++){ var nd=NODES[i];
    var X=sx(nd.x), Y=sy(nd.y); var rr=Math.max(nd.r*view.k+6, 10);
    var dx=mx-X, dy=my-Y; if(dx*dx+dy*dy<=rr*rr) return nd;
  }
  return null;
}

/* ================= 工具提示 ================= */
var tip=document.getElementById('tip');
function showTip(e,nd){
  tip.innerHTML='<span class="tt">'+nd.e+' '+nd.n+' · '+levelName[nd.lvl]+' · '+typeLabel[nd.type]+'</span>'+
    '<ul>'+nd.resp.map(function(r){return '<li>'+r+'</li>';}).join('')+'</ul>';
  tip.style.display='block';
  var x=e.clientX+16,y=e.clientY+14,w=tip.offsetWidth,h=tip.offsetHeight;
  if(x+w>window.innerWidth-8)x=e.clientX-w-16;
  if(y+h>window.innerHeight-8)y=e.clientY-h-14;
  tip.style.left=x+'px'; tip.style.top=y+'px';
}
function hideTip(){ tip.style.display='none'; }

/* ================= 抽屉 ================= */
var mask=document.getElementById('mask'), drawer=document.getElementById('drawer');
function openDrawer(nd){
  var tagHtml = nd.tag ? '<span class="d-tag" style="background:'+nd.tagC+'">'+nd.tag+'</span>' : '';
  document.getElementById('dHead').innerHTML='<span class="d-emoji">'+nd.e+'</span><h2>'+nd.n+' '+tagHtml+'</h2>'+
    '<div class="d-sub">'+nd.detail.定位+' · 引擎 '+nd.eng+(nd.engNote?' · '+nd.engNote:'')+'</div>';
  var flowHtml=(nd.detail.交互||[]).map(function(f){
    var cls=f.d==='up'?'dir-up':(f.d==='down'?'dir-down':(f.d==='both'?'dir-both':'dir-ext'));
    var lb=f.d==='up'?'上游':(f.d==='down'?'下游':(f.d==='both'?'双向':'外部'));
    return '<div class="flow-item"><span class="flow-dir '+cls+'">'+lb+'</span><div><b>'+f.who+'</b><div style="color:#8a8a86;font-size:12px">'+f.what+'</div></div></div>';
  }).join('');
  document.getElementById('dBody').innerHTML=
    '<div class="d-sec"><h3>主要任务</h3><div style="font-size:13px;line-height:1.6">'+nd.task+'</div></div>'+
    '<div class="d-sec"><h3>负责明细</h3><ol>'+nd.resp.map(function(r){return '<li>'+r+'</li>';}).join('')+'</ol></div>'+
    '<div class="d-sec"><h3>工作明细</h3><ol>'+nd.detail.明细.map(function(w){return '<li>'+w+'</li>';}).join('')+'</ol></div>'+
    '<div class="d-sec"><h3>与其他 Agent 的交互</h3>'+flowHtml+'</div>';
  mask.style.display='block'; drawer.classList.add('open');
}
function closeDrawer(){ mask.style.display='none'; drawer.classList.remove('open'); }
document.addEventListener('keydown',function(e){ if(e.key==='Escape')closeDrawer(); });

/* ================= 控制 ================= */
function setMode(m){
  mode=m;
  document.getElementById('btn-net').classList.toggle('active', m==='force');
  document.getElementById('btn-tree').classList.toggle('active', m==='tree');
  if(m==='tree'){ setTreeLayout(); }
  else { initForce(); fit(); }
  needsRender=true;
}
function setFilter(l){
  filterLvl=l;
  document.querySelectorAll('#topbar .seg')[1].querySelectorAll('button').forEach(function(b){
    b.classList.toggle('active', String(b.getAttribute('data-lvl'))===String(l));
  });
  needsRender=true;
}
function setSearch(q){ searchQ=q.trim(); needsRender=true; }
function resetLayout(){ if(mode==='force'){ initForce(); fit(); } else { setTreeLayout(); } }

/* ================= 主循环 ================= */
function loop(){
  if(running && simTicks>0){ for(var t=0;t<3;t++) physics(); simTicks--; if(simTicks<=0) running=false; needsRender=true; }
  if(needsRender){ draw(); needsRender=false; }
  requestAnimationFrame(loop);
}

/* ================= 启动 ================= */
NODES.forEach(function(nd){ nd.r = 8 + Math.min(nd.deg,10)*1.1; });
initForce();
resize();
loop();
</script>
</body>
</html>
