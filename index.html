<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ingrid's AI Agents</title>
<style>
  :root {
    /* 主色（靛紫，现代克制）—— 只给最重要动作与选中态 */
    --accent: #6c5ce7;        /* 靛紫 主色 */
    --accent-2: #5a4bd1;      /* hover/按下 */
    --accent-soft: #efedfb;   /* 浅紫底（非透明度） */
    --accent-softer: #f6f4fd; /* 更浅紫底 */
    --deep: #4536c8;          /* 渐变深端 */

    /* 中性色（干净的中性灰，带一丝冷调） */
    --ink: #221f33;           /* 主文字 */
    --ink-soft: #5e596e;      /* 次要文字 */
    --ink-faint: #a29baf;     /* 禁用/占位 */
    --line: #eae8f0;          /* 分割线/描边 */
    --bg: #f4f4f7;            /* 页面底 */
    --card: #ffffff;          /* 卡片底 */
    --surface-2: #f1f0f5;     /* 次面层 */

    /* 语义色（约定俗成） */
    --success: #16a34a;
    --warning: #d97706;
    --danger: #dc2626;
    --info: #0ea5e9;
    --success-soft: #e9f7ee;
    --warning-soft: #fdf3e3;
    --danger-soft: #fbe9e6;
    --info-soft: #e7f4fc;

    /* 暖橙点缀（今天/高亮/未读等最高优先级，用量 <5%） */
    --gold: #f59e0b;
    --gold-text: #b45309;
    --gold-soft: #fef3e2;

    --shadow: 0 1px 2px rgba(34,31,51,.04), 0 6px 18px rgba(34,31,51,.06);
    --shadow-lg: 0 22px 52px rgba(34,31,51,.18);
    --radius: 14px;

    /* 布局尺寸 */
    --side-w: 208px;          /* 左侧导航宽 */
    --cal-w: 300px;           /* 右侧日历宽 */
    --side-bg: #201c33;       /* 侧栏深墨紫 */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
      "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* ---------- 三栏骨架：左侧导航 + 主区 + 右侧日历 ---------- */
  .app { display: flex; height: 100vh; width: 100vw; }

  /* 左侧深色导航 */
  .side-nav {
    width: var(--side-w); flex: none;
    background: var(--side-bg); color: #b8b0dc;
    display: flex; flex-direction: column;
    padding: 20px 14px 16px; user-select: none;
  }
  .side-brand { display: flex; align-items: center; gap: 12px; padding: 0 6px 22px; }
  .side-brand .mark {
    width: 42px; height: 42px; border-radius: 12px; flex: none;
    display: grid; place-items: center; font-size: 22px; color: #fff;
    background: linear-gradient(135deg, var(--accent), #8b7cf0);
    box-shadow: 0 8px 18px rgba(108,92,231,.36);
  }
  .side-brand .t { line-height: 1.2; }
  .side-brand .t b { display: block; font-size: 16px; font-weight: 800; color: #fff; letter-spacing: -.01em; }
  .side-brand .t span { font-size: 10.5px; color: #8e86b8; }

  .side-menu { flex: 1; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
  .side-menu .side-sep { font-size: 10px; letter-spacing: .1em; color: #5f588a; padding: 12px 10px 6px; text-transform: uppercase; }
  .side-item {
    display: flex; align-items: center; gap: 11px; width: 100%;
    padding: 11px 12px; border: none; border-radius: 11px;
    background: transparent; color: #b8b0dc;
    font-size: 14px; font-weight: 600; cursor: pointer; text-align: left;
    font-family: inherit; transition: background .15s ease, color .15s ease;
  }
  .side-item .ic { width: 20px; height: 20px; flex: none; display: grid; place-items: center; font-size: 17px; }
  .side-item .ic svg { width: 19px; height: 19px; }
  .side-item:hover { background: rgba(255,255,255,.06); color: #fff; }
  .side-item.active { background: linear-gradient(135deg, var(--accent), #7c6cf0); color: #fff; box-shadow: 0 6px 16px rgba(108,92,231,.34); }
  .side-item .bdot { margin-left: auto; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 3px rgba(245,158,11,.18); }

  .side-foot { padding: 14px 8px 0; margin-top: 10px; font-size: 11px; color: #6e6699; border-top: 1px solid rgba(255,255,255,.08); line-height: 1.6; }

  /* 中间主区 */
  .main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
  .shell {
    flex: 1; min-height: 0; overflow-y: auto;
    padding: 24px 32px 14px;
    display: flex; flex-direction: column; gap: 22px;
  }

  /* 右侧日历栏（固定侧边栏） */
  .cal-dock {
    width: var(--cal-w); flex: none; min-width: 0;
    border-left: 1px solid var(--line); background: #fbfafd;
    overflow-y: auto; overflow-x: hidden;
  }

  /* ---------- Header ---------- */
  header.topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 22px 32px 0; }
  .side-item .scnt { margin-left: auto; font-size: 11px; font-weight: 700; color: #8e86b8; background: rgba(255,255,255,.08); padding: 2px 8px; border-radius: 999px; }
  .side-item.active .scnt { color: #fff; background: rgba(255,255,255,.22); }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand .titles h1 { font-size: 22px; font-weight: 750; letter-spacing: -.02em; }
  .brand .titles h1 .accent { color: var(--accent); }
  .brand .titles p { color: var(--ink-faint); font-size: 12.5px; margin-top: 2px; }

  .topbar .meta { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 8px 13px; border-radius: 10px; font-size: 12.5px; font-weight: 600;
    background: var(--card); border: 1px solid var(--line); color: var(--ink-soft);
  }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px rgba(108,92,231,.15); }
  .chip.warn .dot { background: var(--warning); box-shadow: 0 0 0 3px rgba(217,119,6,.15); }
  .chip.chip-btn { cursor: pointer; font-weight: 600; transition: border-color .15s ease, background .15s ease; }
  .chip.chip-btn:hover { border-color: var(--accent); background: var(--accent-soft); }

  /* ---------- Grid ---------- */
  main.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 18px; }

  .tile {
    position: relative; aspect-ratio: 1 / 1;
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; padding: 14px; cursor: pointer; text-align: center;
    transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .tile:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: #cfc9ec; }
  .tile:active { transform: translateY(-1px) scale(.985); }

  .tile .emoji {
    width: 56px; height: 56px; border-radius: 16px;
    display: grid; place-items: center; font-size: 30px; background: var(--accent-soft); color: var(--accent);
  }
  .tile .name { font-size: 15.5px; font-weight: 650; line-height: 1.2; }
  .tile .tag {
    font-size: 11.5px; color: var(--ink-faint); line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    max-width: 100%;
  }
  .tile .engine {
    margin-top: 2px; font-size: 10.5px; font-weight: 600; color: var(--ink-soft);
    background: var(--surface-2); border: 1px solid var(--line); padding: 2px 9px; border-radius: 999px;
    white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
  }

  .badge {
    position: absolute; top: 10px; right: 10px;
    font-size: 10.5px; font-weight: 700; letter-spacing: .02em;
    padding: 3px 8px; border-radius: 999px; color: #fff;
  }
  .badge.new { background: var(--accent); }
  .badge.soon { background: #c4c1d3; color: #fff; }

  .tile-gear {
    position: absolute; top: 10px; left: 10px;
    width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--surface-2); color: var(--ink-soft); cursor: pointer;
    display: grid; place-items: center; font-size: 13px; line-height: 1;
    opacity: 0; transition: opacity .15s ease, background .15s ease, color .15s ease;
  }
  .tile:hover .tile-gear { opacity: 1; }
  .tile-gear:hover { background: var(--accent-soft); color: var(--accent); }

  .tile.featured {
    border: 1.5px solid var(--accent);
    background: var(--card);
  }
  .tile.featured .emoji { background: linear-gradient(135deg, var(--accent), var(--deep)); color: #fff; }

  .tile.placeholder { opacity: .8; }
  .tile.placeholder .emoji { background: #eceaf2; filter: grayscale(.35); }
  .tile.placeholder .name { color: var(--ink-soft); }
  .tile.placeholder .engine { color: var(--ink-faint); background: #efedf5; border-color: var(--line); }

  .tile.add { border-style: dashed; border-color: #cfcbe0; box-shadow: none; background: transparent; }
  .tile.add .plus { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; font-size: 30px; color: var(--accent); background: var(--accent-soft); }
  .tile.add .name { color: var(--ink-soft); font-weight: 600; }

  .tile.preset { border-color: var(--gold); background: #faf8fd; }
  .tile.preset .emoji { background: var(--gold-soft); }
  .badge.preset { background: var(--gold-text); }

  /* ---------- 底部常驻区（秘书 + 监事） ---------- */
  .resident-dock {
    flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
    padding: 12px 32px 20px; border-top: 1px solid var(--line); background: var(--bg);
  }
  @keyframes dockFlash { 0% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: var(--shadow); } }
  .flash { animation: dockFlash 1s ease; }

  /* ---------- Modal ---------- */
  .mask { position: fixed; inset: 0; background: rgba(23,59,73,.42); backdrop-filter: blur(3px); display: none; align-items: center; justify-content: center; padding: 24px; z-index: 50; }
  .mask.open { display: flex; }
  .modal {
    width: min(680px, 100%); max-height: 86vh; overflow: auto;
    background: var(--card); border-radius: 24px; box-shadow: var(--shadow-lg);
    padding: 28px 30px; animation: pop .18s ease;
  }
  @keyframes pop { from { transform: translateY(10px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal header { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 18px; }
  .modal .emoji { width: 62px; height: 62px; border-radius: 18px; display: grid; place-items: center; font-size: 32px; background: var(--accent-soft); color: var(--accent); flex: none; }
  .modal h2 { font-size: 21px; font-weight: 700; }
  .modal .sub { color: var(--ink-soft); font-size: 13px; margin-top: 4px; }
  .modal .close { margin-left: auto; flex: none; width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-soft); font-size: 17px; cursor: pointer; line-height: 1; }
  .modal .close:hover { background: var(--line); }

  .modal section { margin-bottom: 20px; }
  .modal h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-faint); font-weight: 700; margin-bottom: 10px; }
  .modal .desc { color: var(--ink-soft); font-size: 14px; line-height: 1.7; }

  .steps { display: flex; flex-direction: column; gap: 9px; }
  .step { display: flex; gap: 12px; align-items: flex-start; }
  .step .n { flex: none; width: 24px; height: 24px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), var(--deep)); color: #fff; font-size: 12.5px; font-weight: 700; display: grid; place-items: center; }
  .step .t { font-size: 14px; line-height: 1.5; }
  .step .t b { font-weight: 650; }
  .step .t span { color: var(--ink-soft); }

  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tagpill { font-size: 12.5px; padding: 6px 12px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }

  .route-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-soft); }
  .route-line .node { padding: 6px 11px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line); font-weight: 600; color: var(--ink); }
  .route-line .arrow { color: var(--ink-faint); }

  .localnote { margin-top: 14px; padding: 12px 14px; background: var(--accent-softer); border: 1px solid var(--accent-soft); border-left: 3px solid var(--accent); border-radius: 8px; font-size: 12.5px; color: var(--ink-soft); line-height: 1.6; }

  /* 真实执行开关（toggle） */
  .switch { position: relative; display: inline-block; width: 46px; height: 26px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .slider {
    position: absolute; inset: 0; background: #d4d1dd; border-radius: 999px;
    transition: background .18s; cursor: pointer;
  }
  .switch .slider::before {
    content: ''; position: absolute; width: 20px; height: 20px; left: 3px; top: 3px;
    background: #fff; border-radius: 50%; transition: transform .18s;
  }
  .switch input:checked + .slider { background: var(--accent); }
  .switch input:checked + .slider::before { transform: translateX(20px); }

  /* ---------- Settings panel ---------- */
  .engines-list { display: flex; flex-direction: column; gap: 10px; }
  .engine-row {
    display: flex; align-items: center; gap: 12px; padding: 13px 14px;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 13px;
  }
  .engine-row .e-ic { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; font-size: 20px; background: #fff; border: 1px solid var(--line); flex: none; }
  .engine-row .e-body { flex: 1; min-width: 0; }
  .engine-row .e-name { font-size: 14px; font-weight: 650; }
  .engine-row .e-tag { font-size: 11.5px; color: var(--ink-faint); margin-top: 2px; }
  .engine-row .e-kind { font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; flex: none; }
  .engine-row .e-kind.cli { background: var(--accent-soft); color: var(--accent); }
  .engine-row .e-kind.api { background: var(--info-soft); color: var(--info); }
  .engine-row .e-kind.local { background: var(--success-soft); color: var(--success); }
  .engine-row .e-action { flex: none; font-size: 12px; font-weight: 600; color: var(--accent); cursor: pointer; padding: 6px 11px; border: 1px solid var(--line); border-radius: 9px; background: #fff; }
  .engine-row .e-action:hover { border-color: var(--accent); background: var(--accent-soft); }
  .engine-row .e-action.off { color: var(--ink-faint); cursor: default; }
  .engine-row .e-action.off:hover { border-color: var(--line); background: #fff; }
  .status-pill { flex: none; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .status-pill.ok { background: var(--success-soft); color: var(--success); }
  .status-pill.wait { background: var(--warning-soft); color: var(--warning); }
  .status-pill.miss { background: var(--surface-2); color: var(--ink-faint); }

  .kv { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .kv label { flex: none; width: 96px; font-size: 13px; font-weight: 650; color: var(--ink-soft); }
  .kv input { flex: 1; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 13px; color: var(--ink); background: #fff; }
  .kv input:focus { outline: none; border-color: var(--accent); }
  .kv .save { flex: none; padding: 9px 14px; border: none; border-radius: 10px; background: var(--accent); color: #fff; font-size: 13px; font-weight: 650; cursor: pointer; }
  .kv .save:hover { background: var(--accent-2); }

  .engine-status { font-size: 12px; color: var(--ink-soft); margin-top: 8px; line-height: 1.5; }
  .engine-status.ok { color: var(--success); font-weight: 600; }
  .engine-status.warn { color: var(--warning); font-weight: 600; }

  @media (max-width: 720px) {
    .shell { padding: 20px 18px; }
    main.grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
    .brand .titles h1 { font-size: 20px; }
    .hint { margin-left: 0; }
  }
</style>
</head>
<body>
  <div class="app">
    <aside class="side-nav">
      <div class="side-brand">
        <div class="mark" data-icon="bot"></div>
        <div class="t"><b>Ingrid's AI Agents</b><span>个人 AI 工作台</span></div>
      </div>
      <nav class="side-menu">
        <div class="side-sep">工作台</div>
        <button class="side-item active" id="navHome"><span class="ic" data-icon="home"></span><span>首页</span></button>
        <div class="side-sep">助手</div>
        <button class="side-item" id="navSecretary"><span class="ic" data-icon="feather"></span><span>秘书</span><span class="bdot" id="secDot" hidden></span></button>
        <button class="side-item" id="navSupervisor"><span class="ic" data-icon="eye"></span><span>监事</span></button>
        <button class="side-item" id="navCalendar"><span class="ic" data-icon="calendar"></span><span>日历</span></button>
        <div class="side-sep">系统</div>
        <button class="side-item" id="navSkills"><span class="ic" data-icon="grid"></span><span>调度中枢</span><span class="scnt" id="skillsCount">0</span></button>
        <button class="side-item" id="navSettings"><span class="ic" data-icon="settings"></span><span>引擎设置</span></button>
      </nav>
      <div class="side-foot">local-first · 本机优先<br>一个 Agent 指挥多个 Agent</div>
    </aside>

    <div class="main-col">
      <header class="topbar">
        <div class="brand">
          <div class="titles">
            <h1>Agent <span class="accent">工作台</span></h1>
            <p>你的 AI 团队 · 点击卡片打开</p>
          </div>
        </div>
        <div class="meta">
          <span class="chip"><span class="dot"></span><span id="agentCount">1</span> 个 Agent 就绪</span>
          <span class="chip warn"><span class="dot"></span>每个 Agent 独立模型</span>
        </div>
      </header>

      <div class="shell">
        <main class="grid" id="grid"></main>
      </div>
      <div class="resident-dock" id="residentDock"></div>
    </div>

    <aside class="cal-dock" id="calDock"></aside>
  </div>

  <!-- Modal -->
  <div class="mask" id="mask">
    <div class="modal" id="modal"></div>
  </div>

  <!-- Settings -->
  <div class="mask" id="settingsMask">
    <div class="modal" id="settingsModal"></div>
  </div>

<script src="icons.js"></script>
<script src="agents-core.js"></script>
<script src="skills-core.js"></script>
<script src="supervisor-core.js"></script>
<script>
/* ============================================================
 *  Ingrid's AI Agents — 桌面版工作台脚本
 *  - 数据源：AgentRegistry（文件系统优先 / localStorage 回退）
 *  - 渲染方形按钮网格；点击已实现 Agent → 新窗口打开
 *  - 引擎设置面板：CLI 检测 + API Key 加密存储
 * ============================================================ */
const IS_DESKTOP = !!(window.ingrid && window.ingrid.isDesktop);

/* ---------- 首次启动的种子 Agent（含展示字段 + 引擎绑定） ---------- */
const SEED_AGENTS = [
  {
    name: '会议纪要官', emoji: '🎙️',
    tag: '实时转写 · 声纹认人 · 纪要 · 一键 PPT',
    status: 'active', featured: true, badge: '首个',
    engine: 'funasr', engineLabel: 'FunASR · 本地大模型',
    href: 'agents/meeting-audio/index.html',
    soul: '你是专业会议记录员：转写、区分说话人、提炼行动项与决策。',
    fallbacks: ['deepseek'],
    detail: {
      sub: 'Meeting Minutes · 边录边转写，一键出纪要',
      desc: '从「海归海」平台提取的第一个 Agent。边录音边实时转写并自动认出谁在说话；随手写笔记、AI 实时总结；会议结束一键生成结构化纪要，还能导出会议总结 PPT。全程本机处理，内容不上云。',
      workflow: [
        { t: '实时转写', s: '边录边出文字，自动标注说话人' },
        { t: '声纹登记', s: '录一段人声登记，之后自动认出是谁' },
        { t: '随手笔记', s: '边录边记要点，自动保存到本机' },
        { t: 'AI 实时总结', s: '本地大模型一句话概括当前进展' },
        { t: '自动纪要', s: '主题 · 参会人 · 摘要 · 要点 · 决定 · 待办' },
        { t: '一键 PPT', s: '纪要转会议总结 PPT，直接下载' },
      ],
      capabilities: ['实时转写', '说话人分离', '声纹识别', '智能纪要', 'AI 总结', 'PPT 导出'],
      route: [

/* ---------- 存储后端：桌面走文件系统，浏览器回退 localStorage ---------- */
function buildStorage() {
  if (IS_DESKTOP) {
    return {
      load: function () { return window.ingrid.loadAgentsSync(); },
      save: function (agents) { window.ingrid.saveAgents(agents); },
    };
  }
  return null; // AgentRegistry 会用默认 localStorage
}

/* ---------- 注册表 + 路由 ---------- */
const core = window.AgentsCore;
const registry = new core.AgentRegistry('ingrid.agents', buildStorage());
const router = new core.ModelRouter();

// 首次运行 → 写入种子；已存在则直接读取（持久化，刷新不丢）
if (!registry.list().length) {
  SEED_AGENTS.forEach(function (a) { registry.create(a); });
}
// v2 迁移：把旧数据里的「智能路由 ra」升级成调度中枢（老用户刷新后也能用）
registry.list().forEach(function (a) {
  if (/路由|调度|\bra\b/i.test(a.name || '') && a.role !== 'orchestrator') {
    registry.update(a.id, {
      role: 'orchestrator', canControl: true, status: 'active',
      tag: '指挥其他 Agent · 限额切换 · 成本记账',
      engineLabel: '多模型路由 · 已启用', badge: '调度中枢',
    });
  }
});
// v5 迁移：补齐/升级内置核心 Agent（active 种子缺 href 或仍是占位态时，升级为聊天入口）
SEED_AGENTS.forEach(function (seed) {
  if (seed.status !== 'active') return;
  var existing = registry.list().find(function (a) { return a.name === seed.name; });
  if (!existing) {
    registry.create(seed);
  } else if (seed.href && (!existing.href || existing.status !== 'active')) {
    // 老数据里是「详情弹窗版/占位版」（无 href 或非 active），升级为聊天入口
    registry.update(existing.id, {
      href: seed.href, engine: seed.engine, engineLabel: seed.engineLabel,
      fallbacks: seed.fallbacks, status: 'active', tag: seed.tag, soul: seed.soul, detail: seed.detail,
    });
  }
});
// v6 迁移：删除「写作助手」（功能已并入研究助手/通用助手）
['写作助手'].forEach(function (nm) {
  var a = registry.list().find(function (x) { return x.name === nm; });
  if (a) registry.remove(a.id);
});
// v7 迁移：删除「电脑操作员」独立卡片（已能力化为每个 Agent 的 computer/tools 开关）
['电脑操作员'].forEach(function (nm) {
  var a = registry.list().find(function (x) { return x.name === nm; });
  if (a) registry.remove(a.id);
});
window.__reg = registry;

function engineLabelOf(a) {
  return a.engineLabel || (router.resolve(a).meta ? router.resolve(a).meta.name : (a.engine || '待绑定'));
}
function engineOptionsHtml(selected) {
  return Object.keys(core.ENGINES).map(id => {
    const meta = core.ENGINES[id];
    const kindLabel = meta.kind === 'api' ? 'API Key' : (meta.kind === 'cli' ? '会员额度' : '本地');
    return `<option value="${id}"${id === selected ? ' selected' : ''}>${meta.name} · ${kindLabel}</option>`;
  }).join('');
}
// 引擎可用性说明（异步）：本地 / API Key 是否已配 / CLI 是否已装并登录
function engineStatusText(id) {
  const meta = core.ENGINES[id];
  if (!meta) return Promise.resolve('');
  if (meta.kind === 'local') return Promise.resolve('本地引擎 · 需自行启动推理服务（ollama / FunASR），不消耗 Key');
  if (meta.kind === 'api') {
    if (!IS_DESKTOP) return Promise.resolve('浏览器预览模式 · 无法配置 API Key');
    return window.ingrid.getSettings().then(s => (s && s[id])
      ? '✅ 已配置 API Key，可直接调用'
      : '⚠️ 未配置 API Key，先到右上角「引擎设置」填写');
  }
  if (meta.kind === 'cli') {
    if (!IS_DESKTOP) return Promise.resolve('浏览器预览模式 · 无本机 CLI');
    return window.ingrid.detectCli(id).then(ok => {
      if (!ok) return '⚠️ 本机未安装 ' + meta.name + ' CLI，无法调用';
      if (id === 'codex') {
        return window.ingrid.authCli(id).then(a => (a && a.loggedIn)
          ? '✅ 已登录 ChatGPT（会员额度），可用'
          : '⚠️ 已安装但未登录，需运行 codex login');
      }
      return '✅ 本机已安装，可用';
    });
  }
  return Promise.resolve('');
}

/* ---------- v3：板块 / 预设读取（桌面走文件，浏览器走 localStorage） ---------- */
function escHtml(v) {
  return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function loadPresets() {
  if (IS_DESKTOP) { try { return window.ingrid.loadPresetsSync() || []; } catch (e) { return []; } }
  try { return JSON.parse(localStorage.getItem('ingrid.presets') || '[]'); } catch (e) { return []; }
}
function loadBoardMap() {
  let raw = [];
  if (IS_DESKTOP) { try { raw = window.ingrid.loadBoardsSync() || []; } catch (e) {} }
  else { try { raw = JSON.parse(localStorage.getItem('ingrid.boards') || '[]'); } catch (e) {} }
  const m = {};
  (raw || []).forEach(b => { m[b.id] = b; });
  return m;
}
function updateBoardCount() {
  const el = document.getElementById('skillsCount');
  if (el) el.textContent = String(Object.keys(loadBoardMap()).length);
}

function renderAgents() {
  grid.innerHTML = '';
  // 首页不显示「调度中枢」（它是控制面板，从左侧导航进入），其余 Agent 正常展示
  const agents = registry.list().filter(a => a.role !== 'orchestrator');
  // featured（主力）排最前，其余按固定顺序（通用助手排在音乐创作之前）
  const ORDER = ['会议纪要官', '研究助手', '通用助手', '界面设计师', '音乐创作', '数据分析', '翻译助手'];
  agents.sort((x, y) => {
    const fx = x.featured ? 1 : 0, fy = y.featured ? 1 : 0;
    if (fx !== fy) return fy - fx;
    const ix = ORDER.indexOf(x.name), iy = ORDER.indexOf(y.name);
    if (ix >= 0 && iy >= 0) return ix - iy;
    if (ix >= 0) return -1;
    if (iy >= 0) return 1;
    return 0;
  });
  agentCount.textContent = String(agents.filter(a => a.status === 'active').length);
  updateBoardCount();

  agents.forEach(a => {
    const el = document.createElement('div');
    el.className = 'tile' + (a.featured ? ' featured' : '') + (a.status === 'soon' ? ' placeholder' : '');
    const badge = a.badge
      ? `<span class="badge new">${a.badge}</span>`
      : (a.status === 'soon' ? `<span class="badge soon">敬请期待</span>` : '');
    el.innerHTML = `
      ${badge}
      ${a.href ? `<button class="tile-gear" title="设置引擎与工具能力">⚙</button>` : ''}
      <div class="emoji">${iconFor(a.emoji)}</div>
      <div class="name">${a.name}</div>
      <div class="tag">${a.tag}</div>
      <div class="engine">${engineLabelOf(a)}</div>`;
    if (a.href) {
      const gear = el.querySelector('.tile-gear');
      if (gear) gear.addEventListener('click', (ev) => { ev.stopPropagation(); openModal(a); });
    }
    el.addEventListener('click', () => {
      if (a.role === 'orchestrator' && typeof window.__openOrchestrator === 'function') {
        window.__openOrchestrator();
        return;
      }
      if (a.href) {
        if (IS_DESKTOP) window.ingrid.openAgent(a.href);
        else window.open(a.href, '_blank');
      } else openModal(a);
    });
    grid.appendChild(el);
  });

  // 预设方块：板块 + Agent + 技能的一键组合，点击后自动填好调度中枢
  const boardMap = loadBoardMap();
  loadPresets().forEach(p => {
    const el = document.createElement('div');
    el.className = 'tile preset';
    const b = boardMap[p.boardId];
    el.innerHTML = `
      <span class="badge preset">${escHtml(b ? b.name : '预设')}</span>
      <div class="emoji">${iconFor(p.emoji || '⚡')}</div>
      <div class="name">${escHtml(p.name)}</div>
      <div class="tag">${(p.skillIds || []).length} 个技能 · ${(p.agentIds || []).length} 个 Agent</div>
      <div class="engine">一键组合</div>`;
    el.addEventListener('click', () => {
      if (typeof window.__openOrchestratorWith === 'function') window.__openOrchestratorWith(p);
      else if (typeof window.__openOrchestrator === 'function') window.__openOrchestrator();
    });
    grid.appendChild(el);
  });

  const add = document.createElement('div');
  add.className = 'tile add';
  add.innerHTML = `<div class="plus">＋</div><div class="name">新建 Agent</div><div class="tag">在注册表里新增一个 Agent</div>`;
  add.addEventListener('click', openCreateModal);
  grid.appendChild(add);
}

/* ---------- Agent 详情弹窗 ---------- */
function openModal(a) {
  const d = a.detail || { sub: '', desc: '', workflow: [], capabilities: [], route: [] };
  const stepsHtml = d.workflow && d.workflow.length
    ? `<section><h3>工作流</h3><div class="steps">` +
      d.workflow.map((s, i) => `<div class="step"><div class="n">${i + 1}</div><div class="t">${s.t}<br><span>${s.s}</span></div></div>`).join('') + `</div></section>` : '';
  const capsHtml = d.capabilities && d.capabilities.length
    ? `<section><h3>能力</h3><div class="tags">` + d.capabilities.map(c => `<span class="tagpill">${c}</span>`).join('') + `</div></section>` : '';
  const routeHtml = d.route && d.route.length
    ? `<section><h3>引擎 / 模型</h3><div class="route-line">` +
      d.route.map((r, i) => `${i > 0 ? '<span class="arrow">→</span>' : ''}<span class="node">${r.kind}：${r.label}</span>`).join('') + `</div></section>` : '';
  const engineEditHtml = `<section>
      <h3>绑定引擎</h3>
      <div style="display:flex;gap:10px;align-items:center">
        <select id="m-engine" style="flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:13px;background:#fff;color:var(--ink)">${engineOptionsHtml(a.engine)}</select>
        <button id="m-save-engine" style="padding:9px 16px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:13px;font-weight:650;cursor:pointer;white-space:nowrap">保存引擎</button>
      </div>
      <div class="engine-status" id="m-engine-status">检测可用性…</div></section>`;

  const capsEditHtml = a.href ? `<section>
      <h3>工具能力</h3>
      <p class="desc" style="margin-bottom:10px">让这个 Agent 能直接操作本机文件与资料库（读 / 写 / 查 / 搜索；写与删除会逐条弹窗审批）。</p>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:6px;cursor:pointer">
        <input type="checkbox" id="m-fs" ${(a.tools || []).indexOf('fs') >= 0 ? 'checked' : ''}> 📁 文件工具（列目录 · 搜索 · 读 / 写 / 改 / 移动，写操作需审批）
      </label>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:6px;cursor:pointer">
        <input type="checkbox" id="m-db" ${(a.tools || []).indexOf('db') >= 0 ? 'checked' : ''}> 🗄️ 数据库工具（查知识库 / 文献）
      </label>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer">
        <input type="checkbox" id="m-computer" ${(a.computer === 'on' || a.computer === true) ? 'checked' : ''}> 🖱️ 电脑操作（截图 + 鼠标键盘，需系统授权）
      </label></section>` : '';

  modal.innerHTML = `
    <header>
      <div class="emoji">${iconFor(a.emoji || '🤖')}</div>
      <div><h2>${a.name}</h2><div class="sub">${d.sub || ''}</div></div>
      <button class="close" id="close">✕</button>
    </header>
    ${engineEditHtml}
    ${capsEditHtml}
    <section><h3>简介</h3><p class="desc">${d.desc || '暂无描述'}</p></section>
    ${stepsHtml}${capsHtml}${routeHtml}`;
  document.getElementById('close').addEventListener('click', closeModal);
  document.getElementById('m-save-engine').addEventListener('click', () => {
    const engine = document.getElementById('m-engine').value;
    registry.update(a.id, { engine: engine, engineLabel: core.ENGINES[engine] ? core.ENGINES[engine].name : engine });
    closeModal();
    renderAgents();
  });
  // 工具能力开关（能力化）：文件 / 数据库 / 电脑操作，随点随存
  if (a.href) {
    const saveCaps = () => {
      const tools = [];
      if (document.getElementById('m-fs').checked) tools.push('fs');
      if (document.getElementById('m-db').checked) tools.push('db');
      registry.update(a.id, { tools: tools, computer: document.getElementById('m-computer').checked ? 'on' : 'off' });
    };
    document.getElementById('m-fs').addEventListener('change', saveCaps);
    document.getElementById('m-db').addEventListener('change', saveCaps);
    document.getElementById('m-computer').addEventListener('change', saveCaps);
  }
  // 引擎可用性实时提示（切换下拉框时重新检测）
  const refreshEngineStatus = () => {
    const sel = document.getElementById('m-engine');
    const st = document.getElementById('m-engine-status');
    if (!sel || !st) return;
    engineStatusText(sel.value).then(t => {
      var html = t;
      if (t.indexOf('✅') === 0) html = iconSvg('check') + ' ' + t.replace(/^✅\s*/, '');
      else if (t.indexOf('⚠️') === 0) html = iconSvg('warning') + ' ' + t.replace(/^⚠️\s*/, '');
      st.innerHTML = html;
      st.className = 'engine-status' + (t.indexOf('✅') === 0 ? ' ok' : (t.indexOf('⚠️') === 0 ? ' warn' : ''));
    });
  };
  document.getElementById('m-engine').addEventListener('change', refreshEngineStatus);
  refreshEngineStatus();
  mask.classList.add('open');
}
function closeModal() { mask.classList.remove('open'); }
mask.addEventListener('click', e => { if (e.target === mask) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); closeSettings(); } });

/* ---------- 新建 Agent 弹窗 ---------- */
function openCreateModal() {
  const engineOpts = Object.keys(core.ENGINES).map(id =>
    `<option value="${id}">${core.ENGINES[id].name}（${core.ENGINES[id].tag}）</option>`).join('');
  modal.innerHTML = `
    <header>
      <div class="emoji">${iconSvg('sparkles')}</div>
      <div><h2>新建 Agent</h2><div class="sub">填好就保存到本机注册表</div></div>
      <button class="close" id="close">✕</button>
    </header>
    <section>
      <div class="kv"><label>名字</label><input id="c-name" placeholder="例如：周报助手"></div>
      <div class="kv"><label>图标 emoji</label><input id="c-emoji" placeholder="🤖" value="🤖"></div>
      <div class="kv"><label>一句话简介</label><input id="c-tag" placeholder="它负责做什么"></div>
      <div class="kv"><label>绑定引擎</label><select id="c-engine" style="flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:13px;background:#fff;color:var(--ink)">${engineOpts}</select></div>
      <div class="kv"><label>人设 soul</label><input id="c-soul" placeholder="你是……（系统指令）"></div>
      <div class="localnote">引擎表来自 agents-core.js 的 ENGINES；"api" 类引擎需先在「引擎设置」里配 Key。</div>
    </section>
    <section style="text-align:right">
      <button class="save" id="c-save" style="padding:10px 20px;border:none;border-radius:11px;background:var(--accent);color:#fff;font-size:14px;font-weight:650;cursor:pointer">保存 Agent</button>
    </section>`;
  document.getElementById('close').addEventListener('click', closeModal);
  document.getElementById('c-save').addEventListener('click', () => {
    const name = document.getElementById('c-name').value.trim();
    if (!name) { alert('请填写名字'); return; }
    registry.create({
      name: name,
      emoji: document.getElementById('c-emoji').value.trim() || '🤖',
      tag: document.getElementById('c-tag').value.trim(),
      engine: document.getElementById('c-engine').value,
      soul: document.getElementById('c-soul').value.trim(),
      status: 'active',
    });
    closeModal();
    renderAgents();
  });
  mask.classList.add('open');
}

/* ---------- 引擎设置面板 ---------- */
const API_ENGINE_IDS = ['deepseek', 'gpt', 'qwen'];
const CLI_ENGINE_IDS = ['claude-code', 'codex', 'grok'];

// 每个引擎的接法标注：明确区分「会员额度 vs API Key」，避免 GPT / Codex 混淆
const ENGINE_ACCESS = {
  'claude-code': { text: 'Claude 会员', cls: 'cli' },
  'codex':       { text: 'ChatGPT 会员额度', cls: 'cli' },
  'grok':        { text: 'X 会员', cls: 'cli' },
  'deepseek':    { text: 'API Key', cls: 'api' },
  'gpt':         { text: 'API Key', cls: 'api' },
  'qwen':        { text: 'API Key', cls: 'api' },
  'local-llm':   { text: '本地 · 免费', cls: 'local' },
  'funasr':      { text: '本地 · 免费', cls: 'local' },
};
function engineAccessBadge(id, kind) {
  const a = ENGINE_ACCESS[id] || { text: kind === 'api' ? 'API Key' : (kind === 'cli' ? '本机 CLI' : '本地'), cls: kind };
  return `<span class="e-kind ${a.cls}">${a.text}</span>`;
}

function openSettings() {
  // 先画骨架
  settingsModal.innerHTML = `
    <header>
      <div class="emoji">${iconSvg('settings')}</div>
      <div><h2>引擎设置</h2><div class="sub">${IS_DESKTOP ? 'API Key 加密存系统钥匙串 · 本机优先' : '浏览器预览模式（无本机 CLI / 钥匙串）'}</div></div>
      <button class="close" id="s-close">✕</button>
    </header>
    <section>
      <h3>真实执行（安全开关）</h3>
      <div class="engine-row" style="align-items:center">
        <div class="e-body">
          <div class="e-name">允许真实执行</div>
          <div class="e-tag">关闭时，电脑操作与 Agent 运行均为「演练模式」——只看不动、不花 Key、不真改文件</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="s-runmode">
          <span class="slider"></span>
        </label>
      </div>
    </section>
    <section>
      <h3>本机 CLI 引擎（bring-your-own-agent）</h3>
      <div class="engines-list" id="cli-list">检测中…</div>
    </section>
    <section>
      <h3>云端 LLM API Key</h3>
      <div id="api-list"></div>
      <div class="localnote">Key 只写不读（再次打开显示占位），经 Electron safeStorage 加密后落盘，不上云。</div>
    </section>`;
  document.getElementById('s-close').addEventListener('click', closeSettings);

  // 真实执行开关：读取当前状态 + 变化时持久化
  const runmodeEl = document.getElementById('s-runmode');
  if (runmodeEl) {
    if (IS_DESKTOP) {
      window.ingrid.getRunMode().then(on => { runmodeEl.checked = !!on; }).catch(() => {});
      runmodeEl.addEventListener('change', () => window.ingrid.setRunMode(runmodeEl.checked));
    } else {
      runmodeEl.disabled = true;
    }
  }

  // CLI 检测
  const cliList = document.getElementById('cli-list');
  cliList.innerHTML = '';
  CLI_ENGINE_IDS.forEach(id => {
    const meta = core.ENGINES[id];
    const row = document.createElement('div');
    row.className = 'engine-row';
    row.innerHTML = `
      <div class="e-ic">${iconFor(id === 'claude-code' ? '🧠' : id === 'codex' ? '💻' : '🤖')}</div>
      <div class="e-body"><div class="e-name">${meta.name}</div><div class="e-tag">${meta.tag}</div></div>
      ${engineAccessBadge(id, meta.kind)}
      <span class="status-pill wait" data-st>检测中</span>
      <span class="e-action off" data-act>—</span>`;
    cliList.appendChild(row);

    const st = row.querySelector('[data-st]');
    const act = row.querySelector('[data-act]');
    if (!IS_DESKTOP) {
      st.textContent = '预览模式';
      st.className = 'status-pill miss';
      act.textContent = '需桌面版';
      return;
    }
    window.ingrid.detectCli(id).then(ok => {
      if (ok) {
        st.textContent = '已安装';
        st.className = 'status-pill ok';
        act.textContent = '启动';
        act.className = 'e-action';
        act.addEventListener('click', () => window.ingrid.runCli(id));
        // codex 额外显示登录态（吃 ChatGPT 会员额度，不是 API Key）
        if (id === 'codex' && window.ingrid.authCli) {
          window.ingrid.authCli(id).then(a => {
            if (a && a.loggedIn) {
              st.textContent = '已安装 · 已登录';
              st.title = a.mode + ' · 账号 ' + a.accountId + '…';
            } else {
              st.textContent = '已安装 · 未登录';
              st.className = 'status-pill miss';
            }
          });
        }
      } else {
        st.textContent = '未安装';
        st.className = 'status-pill miss';
        act.textContent = '未安装';
      }
    });
  });

  // API Key 输入
  const apiList = document.getElementById('api-list');
  apiList.innerHTML = '';
  API_ENGINE_IDS.forEach(id => {
    const meta = core.ENGINES[id];
    const div = document.createElement('div');
    div.className = 'engine-row';
    div.innerHTML = `
      <div class="e-ic">${iconSvg('key')}</div>
      <div class="e-body"><div class="e-name">${meta.name}</div><div class="e-tag">${meta.tag}</div></div>
      ${engineAccessBadge(id, meta.kind)}
      <input data-key="${id}" type="password" placeholder="sk-…（未设置）" style="flex:1;padding:8px 11px;border:1px solid var(--line);border-radius:9px;font-size:12.5px;background:#fff;color:var(--ink)">`;
    apiList.appendChild(div);
  });

  // 回填已存的 Key（桌面版从钥匙串解密读取）
  if (IS_DESKTOP) {
    window.ingrid.getSettings().then(s => {
      API_ENGINE_IDS.forEach(id => {
        const inp = apiList.querySelector(`[data-key="${id}"]`);
        if (inp && s[id]) inp.value = s[id];
      });
    });
  }

  settingsMask.classList.add('open');
}
function closeSettings() { settingsMask.classList.remove('open'); }
settingsMask.addEventListener('click', e => { if (e.target === settingsMask) closeSettings(); });

// 左侧导航：切换 active 态
function setActiveNav(id) {
  document.querySelectorAll('.side-item').forEach(function (b) { b.classList.toggle('active', b.id === id); });
}
window.__setActiveNav = setActiveNav;

document.addEventListener('click', e => {
  var nav = e.target && e.target.closest ? e.target.closest('.side-item') : null;
  if (!nav) return;
  var id = nav.id;
  if (id === 'navHome') { setActiveNav('navHome'); var s = document.querySelector('.shell'); if (s) s.scrollTop = 0; return; }
  if (id === 'navSettings') { openSettings(); setActiveNav('navSettings'); return; }
  if (id === 'navSkills') { if (typeof window.__openOrchestrator === 'function') window.__openOrchestrator(); setActiveNav('navSkills'); return; }
  if (id === 'navCalendar') { if (typeof window.__openCalendar === 'function') window.__openCalendar(); return; }
  // navSecretary / navSupervisor 由各自面板脚本绑定开关
});

// 在设置面板里拦截“保存”按钮（动态添加监听）
settingsModal.addEventListener('click', e => {
  if (e.target && e.target.id === 's-save') {
    const out = {};
    API_ENGINE_IDS.forEach(id => {
      const inp = settingsModal.querySelector(`[data-key="${id}"]`);
      if (inp && inp.value.trim()) out[id] = inp.value.trim();
    });
    if (IS_DESKTOP) window.ingrid.saveSettings(out);
    alert('已保存（本机钥匙串加密存储）');
  }
});

// 给设置面板加一个保存按钮（骨架里没有，动态补）
const settingsObserver = new MutationObserver(() => {
  const apiList = document.getElementById('api-list');
  if (apiList && !document.getElementById('s-save')) {
    const btn = document.createElement('button');
    btn.id = 's-save';
    btn.textContent = '保存所有 Key';
    btn.style.cssText = 'margin-top:12px;padding:10px 20px;border:none;border-radius:11px;background:var(--accent);color:#fff;font-size:14px;font-weight:650;cursor:pointer';
    apiList.parentElement.appendChild(btn);
  }
});
settingsObserver.observe(settingsModal, { childList: true, subtree: true });

// 把静态 HTML 里 data-icon 占位符替换成纯色 SVG 图标
document.querySelectorAll('[data-icon]').forEach(function (el) {
  el.innerHTML = window.iconSvg(el.getAttribute('data-icon'));
});

renderAgents();

/* 暴露给 orchestrator.js（调度中枢面板） */
window.__workbench = { IS_DESKTOP: IS_DESKTOP, registry: registry, renderAgents: renderAgents };
</script>
<script src="orchestrator.js"></script>
<script src="supervisor.js"></script>
<script src="secretary-core.js"></script>
<script src="secretary.js"></script>
<script src="calendar.js"></script>
</body>
