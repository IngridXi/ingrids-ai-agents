<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>通用助手 · Ingrid's AI Agents</title>
<style>
  :root {
    --accent: #7c6fd6;      /* 柔和高级紫 主紫 */
    --accent-2: #6355c4;
    --accent-soft: #ebe7f7;
    --deep: #4a3f8c;
    --ink: #26232e;
    --ink-soft: #55515e;
    --ink-faint: #8f8b98;
    --line: #e6e4ec;
    --bg: #f7f6f9;
    --card: #ffffff;
    --ok: #1d9e75;
    --danger: #dc2626;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink);
    display: flex; flex-direction: row; overflow: hidden;
  }

  /* 布局：左侧会话栏 + 右侧聊天区 */
  .layout { display: flex; flex: 1; min-height: 0; width: 100%; }
  .sidebar {
    flex: none; width: 264px; background: #f1eff6; border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0; position: relative;
  }
  .sidebar .sb-head { padding: 12px 12px 8px; }
  #newChatBtn {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--accent-2); font-size: 13.5px; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  #newChatBtn:hover { background: var(--accent-soft); border-color: var(--accent); }
  .sidebar .sb-search { padding: 0 12px 10px; display: flex; gap: 6px; align-items: center; }
  .sidebar .sb-search input {
    flex: 1; min-width: 0; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line);
    font-size: 12.5px; background: var(--card); outline: none; color: var(--ink);
  }
  .sidebar .sb-search input:focus { border-color: var(--accent); }
  #searchCount { font-size: 11px; color: var(--ink-faint); min-width: 36px; text-align: center; flex: none; }
  .sidebar .sb-search button {
    flex: none; width: 26px; height: 26px; border: 1px solid var(--line); border-radius: 7px;
    background: var(--card); color: var(--ink-soft); cursor: pointer; font-size: 12px; line-height: 1;
  }
  .sidebar .sb-search button:hover { border-color: var(--accent); color: var(--accent); }
  #sessionList { flex: 1; overflow-y: auto; padding: 4px 8px 12px; }
  .session {
    display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 9px;
    cursor: pointer; margin-bottom: 2px;
  }
  .session:hover { background: #e9e6f1; }
  .session.active { background: var(--card); box-shadow: 0 1px 4px rgba(40,32,70,.10); }
  .session .s-title { flex: 1; min-width: 0; font-size: 13px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session .s-time { font-size: 11px; color: var(--ink-faint); flex: none; }
  .session .s-del {
    flex: none; width: 20px; height: 20px; border: none; background: none; color: var(--ink-faint);
    cursor: pointer; font-size: 13px; border-radius: 5px; display: none; line-height: 1; padding: 0;
  }
  .session:hover .s-del { display: block; }
  .session .s-del:hover { color: var(--danger); background: #fbe7e7; }
  .session .s-rename { flex: 1; min-width: 0; font-size: 13px; padding: 2px 4px; border: 1px solid var(--accent); border-radius: 5px; outline: none; background: #fff; color: var(--ink); }
  .search-empty { padding: 14px 12px; font-size: 12.5px; color: var(--ink-faint); text-align: center; }
  #searchModeBtn {
    flex: none; padding: 0 8px; height: 26px; border: 1px solid var(--line); border-radius: 7px;
    background: var(--card); color: var(--ink-soft); cursor: pointer; font-size: 12px; line-height: 1;
  }
  #searchModeBtn:hover { border-color: var(--accent); color: var(--accent); }
  #searchModeBtn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-2); }
  .sb-search-2 { padding: 0 12px 8px; display: flex; gap: 6px; align-items: center; }
  .sb-search-2 #searchCount { flex: 1; text-align: left; }
  .resize-handle { position: absolute; top: 0; right: -3px; width: 6px; height: 100%; cursor: col-resize; z-index: 10; }
  .sidebar .sb-foot { padding: 8px 12px 12px; border-top: 1px solid var(--line); }
  #backupBtn { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink-soft); font-size: 12px; cursor: pointer; }
  #backupBtn:hover { border-color: var(--accent); color: var(--accent); }
  .session .s-pin { flex: none; width: 20px; height: 20px; border: none; background: none; color: var(--ink-faint); cursor: pointer; font-size: 13px; border-radius: 5px; display: none; line-height: 1; padding: 0; }
  .session:hover .s-pin { display: block; }
  .session.pinned .s-pin { display: block; color: var(--accent-2); }
  .session .s-pin:hover { color: var(--accent); }
  .msg .copy-btn {
    position: absolute; top: 6px; right: 12px; padding: 3px 9px; font-size: 11px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink-soft);
    cursor: pointer; opacity: 0; transition: opacity .12s; z-index: 5;
  }
  .msg.assistant:hover .copy-btn { opacity: 1; }
  .msg .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
  .main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  /* 会话内检索高亮 */
  mark.search-hit { background: #ffe08a; color: #4a3200; border-radius: 2px; padding: 0 1px; }
  .msg.search-active .bubble { box-shadow: 0 0 0 2px #f5b942; }

  header {
    flex: none; display: flex; align-items: center; gap: 10px;
    padding: 14px 20px; background: linear-gradient(120deg, var(--accent), var(--deep)); color: #fff;
    box-shadow: 0 2px 12px rgba(74,63,140,.18); position: relative;
  }
  header .logo { width: 36px; height: 36px; border-radius: 10px; background: rgba(255,255,255,.18); display: grid; place-items: center; flex: none; }
  header .logo svg { width: 20px; height: 20px; }
  header .title { font-size: 16px; font-weight: 700; line-height: 1.2; }
  header .title .sub { font-size: 11.5px; font-weight: 400; opacity: .82; }
  header .spacer { flex: 1; }
  header select {
    padding: 7px 10px; border-radius: 9px; border: 1px solid rgba(255,255,255,.35);
    background: rgba(255,255,255,.16); color: #fff; font-size: 13px; cursor: pointer; outline: none;
  }
  header select option { color: var(--ink); background: #fff; }
  header .h-btn {
    padding: 7px 12px; border-radius: 9px; border: 1px solid rgba(255,255,255,.35);
    background: rgba(255,255,255,.14); color: #fff; font-size: 13px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  header .h-btn:hover { background: rgba(255,255,255,.24); }
  header .h-btn.active { background: rgba(255,255,255,.34); border-color: rgba(255,255,255,.8); }
  header .h-btn svg { width: 15px; height: 15px; }

  #messages { flex: 1; overflow-y: auto; padding: 22px 20px 10px; scroll-behavior: smooth; }
  .msg { display: flex; margin-bottom: 18px; position: relative; }
  .msg .avatar { width: 34px; height: 34px; border-radius: 10px; flex: none; display: grid; place-items: center; font-size: 15px; }
  .msg.user { flex-direction: row-reverse; }
  .msg.user .avatar { background: var(--accent); color: #fff; }
  .msg.user .avatar svg { width: 18px; height: 18px; }
  .msg.assistant .avatar { background: var(--accent-soft); color: var(--accent); }
  .msg.assistant .avatar svg { width: 19px; height: 19px; }
  .msg .bubble {
    max-width: 74%; padding: 11px 14px; border-radius: 14px;
    font-size: 14px; line-height: 1.65; white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; margin-right: 10px; }
  .msg.assistant .bubble { background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 4px; margin-left: 10px; white-space: normal; }

  /* Markdown 富文本样式（assistant 气泡内） */
  .msg.assistant .bubble p { margin: 0 0 8px; }
  .msg.assistant .bubble p:last-child { margin-bottom: 0; }
  .msg.assistant .bubble h1, .msg.assistant .bubble h2, .msg.assistant .bubble h3, .msg.assistant .bubble h4 {
    margin: 12px 0 6px; font-weight: 700; line-height: 1.35; color: var(--ink);
  }
  .msg.assistant .bubble h1 { font-size: 18px; }
  .msg.assistant .bubble h2 { font-size: 16px; }
  .msg.assistant .bubble h3 { font-size: 15px; }
  .msg.assistant .bubble h4 { font-size: 14px; }
  .msg.assistant .bubble ul, .msg.assistant .bubble ol { margin: 6px 0; padding-left: 22px; }
  .msg.assistant .bubble li { margin: 3px 0; }
  .msg.assistant .bubble code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
    background: var(--accent-soft); color: var(--accent-2); padding: 1px 5px; border-radius: 5px;
  }
  .msg.assistant .bubble pre {
    background: #2b2733; color: #e8e6ef; padding: 12px 14px; border-radius: 10px;
    overflow-x: auto; margin: 10px 0; line-height: 1.5;
  }
  .msg.assistant .bubble pre code { background: transparent; color: inherit; padding: 0; font-size: 12.5px; }
  .msg.assistant .bubble blockquote {
    border-left: 3px solid var(--accent); padding: 4px 12px; margin: 8px 0;
    color: var(--ink-soft); background: var(--accent-soft); border-radius: 0 8px 8px 0;
  }
  .msg.assistant .bubble table { border-collapse: collapse; margin: 10px 0; font-size: 13px; display: block; overflow-x: auto; }
  .msg.assistant .bubble th, .msg.assistant .bubble td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
  .msg.assistant .bubble th { background: var(--accent-soft); font-weight: 600; }
  .msg.assistant .bubble hr { border: none; border-top: 1px solid var(--line); margin: 12px 0; }
  .msg.assistant .bubble a { color: var(--accent-2); text-decoration: underline; }
  .msg.assistant .bubble .mermaid { margin: 10px 0; text-align: center; overflow-x: auto; }
  .msg.assistant .bubble .mermaid svg { max-width: 100%; height: auto; }
  .msg.assistant .bubble .mmd-err { color: var(--danger); font-size: 12px; }
  .msg .bubble.err { border-color: #f3c2c0; background: #fdf2f2; color: #b3261e; }
  .msg .bubble .cursor { display: inline-block; width: 8px; height: 15px; background: var(--accent); vertical-align: -2px; margin-left: 1px; border-radius: 2px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .msg .bubble .think {
    font-size: 12.5px; color: var(--ink-soft); background: var(--accent-soft);
    border-radius: 8px; padding: 9px 11px; margin-bottom: 9px; line-height: 1.55;
  }
  .msg .bubble .think .think-head {
    display: flex; align-items: center; gap: 6px;
    font-weight: 600; color: var(--accent-2); font-size: 12.5px; margin-bottom: 4px;
  }
  .msg .bubble .think .think-count {
    font-size: 10.5px; font-weight: 600; color: var(--accent-2); background: #fff;
    border-radius: 9px; padding: 1px 7px; border: 1px solid rgba(99,85,196,.35);
  }
  .msg .bubble .think-step { border-top: 1px dashed rgba(99,85,196,.18); }
  .msg .bubble .think-step:first-of-type { border-top: none; }
  .msg .bubble .think-step summary {
    cursor: pointer; list-style: none; user-select: none;
    display: flex; align-items: flex-start; gap: 7px; padding: 5px 0;
    font-size: 12.5px; color: var(--ink); font-weight: 500;
  }
  .msg .bubble .think-step summary::-webkit-details-marker { display: none; }
  .msg .bubble .think-step summary .think-arrow { flex: 0 0 auto; color: var(--accent); font-size: 11px; line-height: 1.6; transition: transform .12s; }
  .msg .bubble .think-step[open] summary .think-arrow { transform: rotate(90deg); }
  .msg .bubble .think-step summary .think-title { flex: 1; min-width: 0; }
  .msg .bubble .think-step .think-body {
    margin: 2px 0 5px 16px; padding: 6px 9px;
    background: rgba(255,255,255,.62); border-radius: 6px;
    font-size: 12px; color: var(--ink-soft); white-space: pre-wrap; word-break: break-word;
  }
  .msg .bubble .think .think-tag { flex: 0 0 auto; font-size: 10.5px; font-weight: 600; padding: 1px 6px; border-radius: 5px; line-height: 1.5; }
  .msg .bubble .think .think-tag.goal   { background: #e3edfd; color: #1d4ed8; }
  .msg .bubble .think .think-tag.step   { background: #e7e3f8; color: #5b4bc4; }
  .msg .bubble .think .think-tag.tool   { background: #def4ec; color: #0f766e; }
  .msg .bubble .think .think-tag.warn   { background: #fdf0dc; color: #b45309; }
  .msg .bubble .think .think-tag.done   { background: #e4f4e6; color: #15803d; }
  .msg .bubble .think .think-tag.think  { background: #efedf4; color: #6b6575; }

  /* 写操作审批卡片 */
  .approval-card {
    max-width: 640px; margin: 8px 0 8px 48px; padding: 12px 14px;
    background: #fffdf6; border: 1px solid #f0d9a8; border-left: 3px solid #e0a63c;
    border-radius: 12px; font-size: 13px; line-height: 1.55;
  }
  .approval-card .ap-head { display: flex; align-items: center; gap: 8px; font-weight: 600; color: #8a5a12; margin-bottom: 6px; }
  .approval-card .ap-icon { font-size: 16px; }
  .approval-card .ap-body { color: var(--ink); font-family: ui-monospace, Menlo, monospace; font-size: 12px; word-break: break-all; margin-bottom: 6px; }
  .approval-card .ap-extra { color: var(--ink-soft); background: #fbf6ea; border-radius: 8px; padding: 8px 10px; font-size: 12px; word-break: break-all; max-height: 120px; overflow: auto; margin-bottom: 8px; white-space: pre-wrap; }
  .approval-card .ap-actions { display: flex; gap: 8px; }
  .approval-card .ap-actions button {
    flex: 1; padding: 8px 0; border-radius: 9px; border: 1px solid var(--line);
    cursor: pointer; font-size: 13px; font-weight: 600; background: var(--card);
  }
  .approval-card .ap-yes { border-color: #3f9d5a !important; color: #2c7a41; }
  .approval-card .ap-yes:hover { background: #eaf7ee; }
  .approval-card .ap-no { border-color: #e0a2a2 !important; color: #b3261e; }
  .approval-card .ap-no:hover { background: #fdf2f2; }
  .approval-card.decided { opacity: 0.6; }
  .approval-card.decided button { cursor: default; pointer-events: none; }
  .approval-card .ap-all { border-color: #4a7dd6 !important; color: #2b5fa8; }
  .approval-card .ap-all:hover { background: #eaf1fb; }

  /* 批量授权：已自动执行标记 */
  .auto-exec {
    max-width: 640px; margin: 4px 0 4px 48px; padding: 6px 12px;
    font-size: 12px; color: #2c7a41; background: #eaf7ee;
    border: 1px solid #bfe3ca; border-radius: 8px; line-height: 1.5; word-break: break-all;
  }

  .welcome { text-align: center; color: var(--ink-soft); padding: 40px 16px 20px; }
  .welcome .big { width: 60px; height: 60px; border-radius: 18px; background: linear-gradient(135deg, var(--accent), var(--deep)); color: #fff; display: grid; place-items: center; margin: 0 auto 14px; }
  .welcome .big svg { width: 30px; height: 30px; }
  .welcome h2 { font-size: 17px; color: var(--ink); margin-bottom: 6px; }
  .welcome p { font-size: 13px; margin-bottom: 14px; }
  .welcome .hints { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .welcome .hint { padding: 7px 12px; border-radius: 20px; border: 1px solid var(--line); background: var(--card); font-size: 12.5px; color: var(--ink-soft); cursor: pointer; }
  .welcome .hint:hover { border-color: var(--accent); color: var(--accent); }

  footer { flex: none; padding: 12px 20px 16px; background: var(--bg); border-top: 1px solid var(--line); }
  .input-row { display: flex; align-items: flex-end; gap: 10px; max-width: 900px; margin: 0 auto; }
  textarea {
    flex: 1; resize: none; min-height: 44px; max-height: 160px;
    padding: 11px 14px; border: 1px solid var(--line); border-radius: 14px;
    font-size: 14px; line-height: 1.5; font-family: inherit; color: var(--ink); background: var(--card); outline: none;
  }
  textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  #sendBtn { flex: none; width: 44px; height: 44px; border: none; border-radius: 14px; background: var(--accent); color: #fff; cursor: pointer; display: grid; place-items: center; }
  #sendBtn:hover { background: var(--accent-2); }
  #sendBtn:disabled { background: #c9c4e0; cursor: not-allowed; }
  #sendBtn svg { width: 20px; height: 20px; }
  .tool-btn {
    flex: none; width: 40px; height: 44px; border: 1px solid var(--line); border-radius: 14px;
    background: var(--card); color: var(--ink-soft); cursor: pointer; display: grid; place-items: center;
  }
  .tool-btn:hover { border-color: var(--accent); color: var(--accent); }
  .tool-btn svg { width: 19px; height: 19px; }
  .tool-btn.rec { background: #fdecec; border-color: var(--danger); color: var(--danger); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
  .img-preview { display: flex; gap: 8px; align-items: center; max-width: 900px; margin: 8px auto 0; padding: 6px 8px; background: var(--surface-2, #efeef3); border: 1px dashed var(--line); border-radius: 10px; }
  .img-preview img { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
  .img-preview .nm { font-size: 12px; color: var(--ink-soft); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .img-preview .x { border: none; background: none; color: var(--ink-faint); cursor: pointer; font-size: 16px; }
  .img-preview .x:hover { color: var(--danger); }
  .user-img { margin-bottom: 8px; }
  .user-img img { max-width: 220px; max-height: 180px; border-radius: 10px; display: block; }
  .msg.user .bubble .note-tag { display: inline-block; margin-right: 6px; padding: 1px 7px; font-size: 11px; font-weight: 600; color: #fff; background: var(--accent-2); border-radius: 6px; vertical-align: 1px; }
  .foot-note { text-align: center; font-size: 11px; color: var(--ink-faint); margin-top: 8px; }
  .context-tag { font-size: 11px; color: var(--ink-faint); margin-top: 6px; text-align: center; min-height: 14px; }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sb-head"><button id="newChatBtn">＋ 新对话</button></div>
    <div class="sb-search">
      <input id="searchInput" type="text" placeholder="搜索消息">
      <button id="searchModeBtn" title="本会话 / 全局搜索切换">本会话</button>
    </div>
    <div class="sb-search sb-search-2">
      <span id="searchCount"></span>
      <button id="searchPrev" title="上一条">↑</button>
      <button id="searchNext" title="下一条">↓</button>
    </div>
    <div id="sessionList"></div>
    <div class="sb-foot"><button id="backupBtn" title="把全部聊天记录导出为一个 JSON 备份文件">⤓ 备份全部对话</button></div>
    <div class="resize-handle"></div>
  </aside>
  <div class="main-col">
<header>
  <div class="logo" id="logo"></div>
  <div class="title">
    通用助手
    <div class="sub">Assistant · 日常问答与文档</div>
  </div>
  <div class="spacer"></div>
  <select id="engineSelect" title="选择聊天引擎"></select>
  <button class="h-btn" id="webBtn" title="联网搜索（提问时自动检索实时信息）"><span id="webIcon"></span>联网</button>
  <button class="h-btn" id="exportBtn" title="把最后一条回答导出为 Word 文档"><span id="exportIcon"></span>导出 Word</button>
  <button class="h-btn" id="batchAuthBtn" title="批量授权：开启后本会话所有写操作（写文件/打标签/归档）不再逐个弹窗确认，直接执行；关窗自动恢复">🔓 批量授权</button>
  <button class="h-btn" id="clearBtn" title="开启一个新对话">新对话</button>
</header>

<main id="messages"></main>

<footer>
  <div class="input-row">
    <button class="tool-btn" id="imgBtn" title="添加图片（识图/OCR/看图提问）"></button>
    <button class="tool-btn" id="micBtn" title="语音输入"></button>
    <textarea id="input" rows="1" placeholder="问我任何事；粘贴一个网址可让我抓取并总结…（可粘贴/上传图片，或点麦克风说话）"></textarea>
    <button id="sendBtn" title="发送"></button>
  </div>
  <div class="img-preview" id="imgPreview" hidden></div>
  <div class="context-tag" id="contextTag"></div>
  <div class="foot-note" id="footNote">本地 Ollama 免费 · 云端 API 需先在主界面「引擎设置」配 Key</div>
</footer>
  </div>
</div>
<input type="file" id="imgFile" accept="image/*" hidden>

<script src="../../vendor/marked.min.js"></script>
<script src="../../vendor/mermaid.min.js"></script>
<script src="../../agents-core.js"></script>
<script src="../../icons.js"></script>
<script src="../../supervisor-core.js"></script>
<script>
(function () {
  'use strict';
  var IS_DESKTOP = !!(window.ingrid && window.ingrid.isDesktop);

    s = s.replace(/<\|DSML\|\s*parameter\s+name="[^"]*"\s+string="(?:true|false)"\s*>[\s\S]*?<\/\|DSML\|\s*parameter\s*>/g, '');
    // 残留标签
    s = s.replace(/<\/?\s*tool\b[^>]*>/g, '');

    s = s.replace(/<\/?\|DSML\|[^>]*>/g, '');

    sendBtn.innerHTML = window.iconSvg('send');
    el('webIcon').innerHTML = window.iconSvg('globe');
    el('exportIcon').innerHTML = window.iconSvg('file');
    el('imgBtn').innerHTML = window.iconSvg('camera');
    el('micBtn').innerHTML = window.iconSvg('mic');
  }
  function avatarHtml(role) {
    if (role === 'user') return '<div class="avatar">' + window.iconSvg('user') + '</div>';
    return '<div class="avatar">' + window.iconSvg('message') + '</div>';
  }

  /* ---------- 图片输入（上传 / 粘贴 / 拖拽） ---------- */
  function renderImgPreview() {
    var p = el('imgPreview');
    if (!pendingImage) { p.hidden = true; p.innerHTML = ''; return; }
    p.hidden = false;
    p.innerHTML = '<img src="' + pendingImage.dataUrl + '">' +
      '<span class="nm">' + esc(pendingImage.name) + '</span>' +
      '<button class="x" id="imgClear" title="移除图片">✕</button>';
    el('imgClear').addEventListener('click', function () { pendingImage = null; renderImgPreview(); });
  }
  function attachImage(file) {
    if (!file || !file.type || file.type.indexOf('image/') !== 0) return;
    if (file.size > 8 * 1024 * 1024) { alert('图片过大（超过 8MB），请压缩后重试'); return; }
    var reader = new FileReader();
    reader.onload = function () { pendingImage = { dataUrl: reader.result, name: file.name || '图片' }; renderImgPreview(); };
    reader.readAsDataURL(file);
  }
  function bindImageInputs() {
    var fileInput = el('imgFile');
    el('imgBtn').addEventListener('click', function () { fileInput.click(); });
    fileInput.addEventListener('change', function () { if (fileInput.files && fileInput.files[0]) attachImage(fileInput.files[0]); fileInput.value = ''; });
    document.addEventListener('paste', function (e) {
      var items = e.clipboardData && e.clipboardData.items;
      if (!items) return;
      for (var i = 0; i < items.length; i++) {
        if (items[i].type && items[i].type.indexOf('image/') === 0) { attachImage(items[i].getAsFile()); return; }
      }
    });
    document.addEventListener('dragover', function (e) { e.preventDefault(); });
    document.addEventListener('drop', function (e) { e.preventDefault(); if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) attachImage(e.dataTransfer.files[0]); });
  }

  /* ---------- 语音输入（Web Speech API） ---------- */
  function toggleVoice() {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert('当前环境不支持语音识别（需要联网的 Chromium 内核）'); return; }
    if (recognition) { recognition.stop(); recognition = null; el('micBtn').classList.remove('rec'); return; }
    recognition = new SR();
    recognition.lang = 'zh-CN';
    recognition.interimResults = true;
    recognition.continuous = false;
    recognition.onresult = function (e) {
      var t = '';
      for (var i = e.resultIndex; i < e.results.length; i++) t += e.results[i][0].transcript;
      input.value = t; autoGrow();
    };
    recognition.onend = function () { recognition = null; el('micBtn').classList.remove('rec'); };
    recognition.onerror = function () { recognition = null; el('micBtn').classList.remove('rec'); };
    recognition.start();
    el('micBtn').classList.add('rec');
  }

  function loadSoul() {
    try {
      var agents = IS_DESKTOP ? window.ingrid.loadAgentsSync() : [];
      for (var i = 0; i < agents.length; i++) {
        if (agents[i].name === '通用助手' && agents[i].soul) { soul = agents[i].soul; systemPrompt = soul; break; }
      }
    } catch (e) { /* fallback */ }
  }

  function loadEngines() {
    var opts = [
      { id: 'ollama', label: ENGINE_META.ollama.label },
      { id: 'ollama-vision', label: ENGINE_META['ollama-vision'].label },
    ];
    var preferred = null;
    function render() {
      engineSelect.innerHTML = '';
      opts.forEach(function (o) {
        var opt = document.createElement('option');
        opt.value = o.id; opt.textContent = o.label;
        engineSelect.appendChild(opt);
      });
      if (preferred) engineSelect.value = preferred;
    }
    if (IS_DESKTOP) {
      window.ingrid.getSettings().then(function (s) {
        ['deepseek', 'gpt', 'qwen'].forEach(function (id) {
          if (s && s[id]) { opts.push({ id: id, label: ENGINE_META[id].label }); if (!preferred) preferred = id; }
        });
        render();
      }).catch(function () { render(); });
    } else { render(); }
  }

  function addBubble(role, html) {
    var wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    wrap.innerHTML = avatarHtml(role) + '<div class="bubble">' + html + '</div>';
    if (role === 'assistant') {
      var cb = document.createElement('button');
      cb.className = 'copy-btn';
      cb.title = '复制回答';
      cb.textContent = '复制';
      cb.addEventListener('click', function () { copyBubbleText(wrap.querySelector('.bubble'), cb); });
      wrap.appendChild(cb);
    }
    messages.appendChild(wrap);
    messages.scrollTop = messages.scrollHeight;
    return wrap.querySelector('.bubble');
  }
  function fallbackCopyText(text) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }
  function flashCopy(btn) {
    if (!btn) return;
    var o = btn.textContent; btn.textContent = '✓ 已复制';
    setTimeout(function () { btn.textContent = o; }, 1200);
  }
  function copyBubbleText(bubble, btn) {
    var clone = bubble.cloneNode(true);
    Array.prototype.forEach.call(clone.querySelectorAll('.think, .cursor, .copy-btn'), function (n) { n.remove(); });
    var text = clone.textContent.replace(/\n{3,}/g, '\n\n').trim();
    if (!text) return;
    var done = function () { flashCopy(btn); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallbackCopyText(text); done(); });
    } else { fallbackCopyText(text); done(); }
  }

  function welcome() {
    var hints = [
      '帮我写一份本周工作周报',
      '把这段文字润色得更正式',
      '解释一下什么是 RAG',
      '给我一个健身计划',
    ];
    var html = '<div class="welcome">' +
      '<div class="big">' + window.iconSvg('message') + '</div>' +
      '<h2>通用助手 · 随时可问</h2>' +
      '<p>日常问答 · 联网搜索 · 抓网页 · 导出 Word</p>' +
      '<div class="hints">' + hints.map(function (h) { return '<span class="hint">' + h + '</span>'; }).join('') + '</div>' +
      '</div>';
    messages.innerHTML = html;
    Array.prototype.forEach.call(messages.querySelectorAll('.hint'), function (n) {
      n.addEventListener('click', function () { input.value = n.textContent; input.focus(); autoGrow(); });
    });
  }

  function autoGrow() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  }

  // 补充说明的包装格式：让模型知道这是附加约束/偏好，而非新任务
  function noteWrap(s) {
    return '【补充说明 · 仅作为附加约束/偏好，不是新任务，请纳入后续工作方式但不要复述它】\n' + s;
  }

  // 生成中发送文字：自动当作「补充说明」，排队等当前回复结束后自动续发（无需 /note 前缀）
  function queueNote(text) {
    input.value = ''; autoGrow();
    var html = '<span class="note-tag">补充说明</span>' + esc(text);
    addBubble('user', html);
    pendingNotes.push(text);
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  /* ---------- 思考过程结构化展示：分段 + 标签 + 可折叠（像 WorkBuddy 的思考卡片） ---------- */
  function classifyThinking(seg) {
    if (/失败|错误|不存在|error|异常|无法|拒绝|没找到|没有找到|打不开/.test(seg)) return { tag: '遇到问题', cls: 'warn' };
    if (/结论|最终|总结|因此|所以|答案|完成|搞定|结果|综上/.test(seg)) return { tag: '结论', cls: 'done' };
    if (/工具|fs_|db_|computer|执行|调用|检索|搜索|读取|写入|列出/.test(seg)) return { tag: '调用工具', cls: 'tool' };
    if (/用户|需求|想要|希望|问题|任务|目标|要求|先理解|先确认/.test(seg)) return { tag: '理解需求', cls: 'goal' };
    if (/首先|第一步|接着|然后|接下来|开始|先|再|之后|继续|下一步/.test(seg)) return { tag: '推进', cls: 'step' };
    return { tag: '思考', cls: 'think' };
  }
  function thinkingTitle(seg) {
    var first = seg.split('\n')[0].trim();
    first = first.replace(/^(好的|好|嗯|首先|那么|所以|然后|接下来|另外|注意|其实|让我想想|让我先|我先|总之|因此|其次|再次|综上)[，,：:]?/, '');
    first = first.replace(/[，。：；！？,.:;!?、]+$/, '').trim();
    if (!first) first = seg.replace(/\s+/g, ' ').trim();
    if (first.length > 34) first = first.slice(0, 34) + '…';
    return first;
  }
  function splitThinking(text) {
    var t = String(text || '').trim();
    if (!t) return [];
    var raw = t.split(/\n+/).map(function (s) { return s.trim(); }).filter(Boolean);
    if (!raw.length) raw = [t];
    var blocks = [];
    raw.forEach(function (line) {
      var strong = /失败|错误|不存在|error|异常|无法|拒绝|没找到/.test(line);
      if (blocks.length && !strong && line.length < 18 && blocks[blocks.length - 1].length < 200) {
        blocks[blocks.length - 1] += '\n' + line;
      } else blocks.push(line);
    });
    var out = [];
    blocks.forEach(function (b) {
      if (b.length <= 240) { out.push(b); return; }
      var parts = b.match(/[^。；！？.!?;]+[。；！？.!?;]?/g) || [b];
      var cur = '';
      parts.forEach(function (p) {
        if ((cur + p).length > 230 && cur) { out.push(cur); cur = p; }
        else cur += p;
      });
      if (cur) out.push(cur);
    });
    return out;
  }
  function renderThinking(text, openLast) {
    var steps = splitThinking(text);
    if (!steps.length) return '';
    var html = '<div class="think"><div class="think-head">思考过程<span class="think-count">' + steps.length + ' 步</span></div>';
    steps.forEach(function (b, i) {
      var c = classifyThinking(b);
      var open = (openLast && i === steps.length - 1) ? ' open' : '';
      html += '<details class="think-step"' + open + '><summary><span class="think-arrow">▸</span><span class="think-tag ' + c.cls + '">' + esc(c.tag) + '</span><span class="think-title">' + esc(thinkingTitle(b)) + '</span></summary><div class="think-body">' + esc(b) + '</div></details>';
    });
    html += '</div>';
    return html;
  }

  function setContextTag(txt) { el('contextTag').textContent = txt || ''; }

  function send() {
    var text = input.value.trim();
    var img = pendingImage;
    if (!text && !img) return;
    // 生成中发送：文字自动当作「补充说明」排队，当前回复结束后自动续发（无需 /note 前缀）
    if (streaming) {
      if (text) queueNote(text);
      return;
    }
    input.value = ''; autoGrow();
    pendingImage = null; renderImgPreview();

    // 识别「补充说明」前缀（/note、/n、/补充、/备注 或 【补充】、[note]）
    var isNote = false;
    var body = text;
    var nm = text.match(/^\/(?:note|n|补充|备注)\s+([\s\S]*)$/i);
    if (!nm) nm = text.match(/^(?:【补充】|\[note\]|\[补充\])\s*([\s\S]*)$/i);
    if (nm && nm[1] && nm[1].trim()) { isNote = true; body = nm[1].trim(); }

    if (messages.querySelector('.welcome')) messages.innerHTML = '';
    // 用户气泡（补充说明加标签；自动续发时用户气泡已提前显示，跳过）
    var userHtml = '';
    if (img) userHtml += '<div class="user-img"><img src="' + img.dataUrl + '"></div>';
    if (isNote) userHtml += '<span class="note-tag">补充说明</span>';
    userHtml += esc(body || (img ? '（发送了一张图片）' : ''));
    if (!suppressUserBubble) addBubble('user', userHtml);
    suppressUserBubble = false;

    // 1) 粘贴网址 → 抓取网页正文，基于网页回答（仅纯文本，且非补充说明）
    var urlMatch = body.match(/https?:\/\/\S+/);
    if (urlMatch && !img && !isNote && IS_DESKTOP) {
      var url = urlMatch[0];
      var instruction = text.replace(urlMatch[0], '').trim() || '请总结这个网页的主要内容';
      history.push({ role: 'user', content: text });
      while (history.length > 24) history.shift();
      touchCurrentSession(); persistSessions(); renderSessionList();
      withWebFetch(url, instruction);
      return;
    }

    // 2) 普通聊天：联网搜索（可选）+ 流式回答
    var bubble = addBubble('assistant', '<span class="cursor"></span>');
    var acc = '', thinking = '';
    var live = '';
    streaming = true; sendBtn.disabled = true;
    var engine = engineSelect.value || 'ollama';
    if (img && engine === 'ollama') engine = 'ollama-vision';

    function renderStream() {
      var thinkHtml = renderThinking(thinking, true);
      bubble.innerHTML = thinkHtml + (acc ? mdToHtml(acc) : '') + (live ? mdToHtml(live) : '') + '<span class="cursor"></span>';
      messages.scrollTop = messages.scrollHeight;
    }
    function finish(finalText, err) {
      history.push({ role: 'user', content: isNote ? noteWrap(body) : (body || (img ? '（图片）' : '')) });
      if (finalText) history.push({ role: 'assistant', content: finalText });
      while (history.length > 24) history.shift();
      touchCurrentSession();
      persistSessions();
      renderSessionList();
      var thinkHtml = renderThinking(thinking, false);
      bubble.innerHTML = thinkHtml + (err ? '<span class="err">' + esc((finalText || '') + (finalText ? '\n\n' : '') + '⚠️ ' + err) + '</span>' : mdToHtml(finalText || '（无回复）'));
      if (err) bubble.classList.add('err');
      else renderMermaidIn(bubble);
      streaming = false; sendBtn.disabled = false;
      setContextTag('');
      input.focus();
      // 正常结束后若有排队的补充说明，自动当作 /note 续发，让约束立即生效
      if (!err && pendingNotes.length) {
        suppressUserBubble = true;
        input.value = '/note ' + pendingNotes.shift();
        setTimeout(send, 0);
      }
    }
    function run(content) {
      if (!isNote) liveTaskGoal = body || '';
      var prompt = content || (img ? '请分析这张图片。' : '');
      if (isNote) prompt = noteWrap(prompt);
      var userMsg = { role: 'user', content: prompt };
      if (img) userMsg.content = [
        { type: 'text', text: prompt },
        { type: 'image_url', image_url: { url: img.dataUrl } },
      ];
      var reqMessages = [{ role: 'system', content: buildSystemPrompt() }]
        .concat(history.slice(-12))
        .concat([userMsg]);
      if (!IS_DESKTOP) { finish('（浏览器预览模式：无法调用模型。请用桌面应用运行。）'); return; }

      var failStreak = 0;   // 连续工具失败轮数（有一项成功即清零），用于触发纠正提示、避免死循环
      var emptyStreak = 0;  // 连续空回复次数（推理型模型可能只输出思考、不输出正文），用于自动重试
      var pendingStreak = 0;   // 连续「只说不做」次数，用于兜底：模型声明要动手却没真正调用工具时再催一次
      var driftStreak = 0;     // 实时监事：连续「收尾正文与核心目标零关联」次数，触发目标纠偏
      // 原生工具调用：云端 OpenAI 兼容引擎传 tools 参数走 function calling；本地 Ollama 沿用文本 <tool> 标签
      var useNativeTools = (engine === 'deepseek' || engine === 'gpt' || engine === 'qwen');
      var toolsPayload = useNativeTools ? toolsDef(agentCapabilities()) : null;

      function runToolTurn(msgs, round) {
        live = '';
        window.ingrid.chatStream({ engine: engine, messages: msgs, tools: toolsPayload }, {
          onDelta: function (d) {
            if (d && d.thinking) thinking += d.thinking;
            if (d && d.text) live += d.text;
            renderStream();
          },
          onDone: function (d) {
            var rawRound = live;
            if (d && !d.ok) { finish(acc + stripToolMarkers(rawRound), d && d.error); return; }
            // 工具调用：优先原生 tool_calls，退回文本 <tool> 标签解析
            var nativeCalls = (d && Array.isArray(d.tool_calls)) ? d.tool_calls : [];
            var calls = nativeCalls.length
              ? nativeCalls.map(function (tc) { return { name: tc.name, args: parseToolArgs(tc.arguments), _id: tc.id }; })
              : extractToolCalls(rawRound);
            if (calls.length && round < MAX_TOOL_ROUNDS) {
              acc += stripToolMarkers(rawRound);
              live = '';
              var caps = agentCapabilities();
              Promise.all(calls.map(function (c) {
                return executeTool(c, caps)
                  .then(function (r) { return formatToolResult(c, r); })
                  .catch(function (e) { return '【工具 ' + c.name + ' 结果】\n工具执行失败：' + String((e && e.message) || e); });
              })).then(function (results) {
                acc += '\n\n[已使用工具 ' + calls.map(function (c) { return c.name; }).join('、') + ']\n\n';
                renderStream();
                // 连续失败计数：只要有一项成功就清零，全失败则累加；用于触发纠正提示、避免死循环
                var allFailed = results.length > 0 && results.every(function (r) { return r.indexOf('工具执行失败') >= 0; });
                failStreak = allFailed ? (failStreak + 1) : 0;
                var correction = failStreak >= 2
                  ? '【系统提示 · 重要】连续多次工具调用失败，不要再重复完全相同的尝试。先读上面的错误信息找出原因（路径不对、名称含空格或全角字符、iCloud 文件未下载到位等），换一种办法（先用 fs_list 列目录看真实名称、用 fs_search 搜索、修正路径大小写与空格），或者明确告诉用户你卡在哪、需要什么信息。'
                  : '';
                var next;
                if (nativeCalls.length) {
                  // 原生工具调用：用 role:tool 回传结果，模型才能继续
                  var assistantMsg = { role: 'assistant', content: rawRound || '', tool_calls: nativeCalls.map(function (tc) { return { id: tc.id, type: 'function', function: { name: tc.name, arguments: tc.arguments } }; }) };
                  var toolMsgs = calls.map(function (c, i) { return { role: 'tool', tool_call_id: nativeCalls[i] ? nativeCalls[i].id : ('t' + i), content: results[i] }; });
                  next = msgs.concat([assistantMsg]).concat(toolMsgs);
                  if (correction) next = next.concat([{ role: 'user', content: correction }]);
                } else {
                  next = msgs.concat([{ role: 'assistant', content: rawRound }])
                    .concat([{ role: 'user', content: results.join('\n\n') + (correction ? '\n\n' + correction : '') }]);
                }
                runToolTurn(next, round + 1);
              }).catch(function (e) { finish(acc + stripToolMarkers(rawRound), '工具执行异常：' + String((e && e.message) || e)); });
            } else {
              var stripped = stripToolMarkers(rawRound).replace(/^\s+|\s+$/g, '');
              if (!stripped) {
                // 空回复（推理型模型常见：只输出思考、正文为空或仅换行）。自动重试，逼它给出正文
                emptyStreak += 1;
                if (emptyStreak < 4) {
                  var nudgeMsgs = msgs.concat([{ role: 'assistant', content: rawRound }])
                    .concat([{ role: 'user', content: '你上一条回复只有思考、没有正文。请现在直接输出完整回答（需要就调用工具继续推进任务），不要只写思考过程，也不要复述前面已经说过的话。' }]);
                  live = '';
                  runToolTurn(nudgeMsgs, round);
                  return;
                }
                finish(acc, '连续多次返回空回复，模型可能暂时异常。请换一个模型，或点重试。');
                return;
              }
              // 「只说不做」兜底：模型声明要动手却没真正调用工具，再催一次
              if (round < MAX_TOOL_ROUNDS && looksLikePendingAction(stripped)) {
                pendingStreak += 1;
                if (pendingStreak < 3) {
                  var actMsgs = msgs.concat([{ role: 'assistant', content: rawRound }])
                    .concat([{ role: 'user', content: '你说要「' + stripped.slice(0, 40) + '」但并没有真正调用工具。请立刻调用工具执行这一步（不要只描述你打算做什么）；如果这一步已经完成，请直接给出最终结果。' }]);
                  live = '';
                  runToolTurn(actMsgs, round + 1);
                  return;
                }
              }
              // 实时监事：收尾正文与核心目标完全零关联时，拉回目标再补一轮（防目标漂移）
              if (round < MAX_TOOL_ROUNDS && liveTaskGoal && liveTaskGoal.length >= 6 && window.SupervisorCore) {
                var sig = window.SupervisorCore.fastDriftCheck(stripped, [{ text: liveTaskGoal, weight: 3, active: true }]);
                if (sig.level === 'warn' && sig.score === 0) {
                  driftStreak += 1;
                  if (driftStreak < 2) {
                    statusText = '监事发现可能偏离目标，正在拉回…';
                    renderStream();
                    var backMsgs = msgs.concat([{ role: 'assistant', content: rawRound }])
                      .concat([{ role: 'user', content: '【监事 · 目标纠偏】你上面的回复和本次核心目标「' + liveTaskGoal.slice(0, 120) + '」没有关联。请回到这个目标把它完成（该调用工具就调用工具），不要答非所问、不要另起炉灶。' }]);
                    live = '';
                    runToolTurn(backMsgs, round + 1);
                    return;
                  }
                } else if (sig.score > 0) {
                  driftStreak = 0;
                }
              }
              acc += stripToolMarkers(rawRound);
              finish(acc);
            }
          },
        });
      }

      runToolTurn(reqMessages, 0);
    }

    // 补充说明是约束/偏好，不走联网搜索，直接发给模型；其余按开关联网
    if (isNote) {
      run(body);
    } else if (webEnabled && IS_DESKTOP) {
      setContextTag('🔍 正在联网搜索…');
      window.ingrid.webSearch({ query: text, n: 4 }).then(function (r) {
        if (r && r.ok && r.results && r.results.length) {
          var ctx = r.results.map(function (x, i) {
            return '[' + (i + 1) + '] ' + x.title + '\n' + x.link + '\n' + (x.snippet || '');
          }).join('\n\n');
          setContextTag('已联网检索 ' + r.results.length + ' 条结果');
          run('【联网搜索结果 · 仅作参考，与问题无关则忽略，回答时标注来源】\n' + ctx + '\n\n【用户问题】\n' + text);
        } else {
          setContextTag('联网搜索未命中，直接回答');
          run(text);
        }
      }).catch(function (e) { setContextTag(''); run(text); });
    } else {
      run(text);
    }
  }

  // 抓取网页 → 总结
  function withWebFetch(url, instruction) {
    var bubble = addBubble('assistant', '<span class="cursor"></span>');
    var acc = '', thinking = '';
    streaming = true; sendBtn.disabled = true;
    setContextTag('🌐 正在抓取 ' + url + ' …');
    var engine = engineSelect.value || 'ollama';

    window.ingrid.webFetch({ url: url }).then(function (r) {
      if (!r || !r.ok) { finish('', r && r.error); return; }
      setContextTag('已抓取：' + r.title);
      var content = '【网页标题】' + r.title + '\n【网页内容】\n' + r.content + '\n\n【用户指令】\n' + instruction;
      var reqMessages = [{ role: 'system', content: buildSystemPrompt() }].concat([{ role: 'user', content: content }]);
      window.ingrid.chatStream({ engine: engine, messages: reqMessages }, {
        onDelta: function (d) { if (d && d.thinking) thinking += d.thinking; if (d && d.text) acc += d.text; render(); },
        onDone: function (d) { if (d && d.ok) finish(acc); else finish(acc, d && d.error); },
      });
    }).catch(function (e) { finish('', String(e && e.message || e)); });

    function render() {
      var thinkHtml = renderThinking(thinking, true);
      bubble.innerHTML = thinkHtml + (acc ? mdToHtml(acc) : '') + '<span class="cursor"></span>';
      messages.scrollTop = messages.scrollHeight;
    }
    function finish(finalText, err) {
      var thinkHtml = renderThinking(thinking, false);
      bubble.innerHTML = thinkHtml + (err ? '<span class="err">' + esc('⚠️ ' + err) + '</span>' : mdToHtml(finalText || '（无回复）'));
      if (err) bubble.classList.add('err');
      else renderMermaidIn(bubble);
      if (finalText) { history.push({ role: 'assistant', content: finalText }); touchCurrentSession(); persistSessions(); renderSessionList(); }
      streaming = false; sendBtn.disabled = false;
      setContextTag('');
      input.focus();
    }
  }

  // 导出最后一条回答为 Word
  function exportWord() {
    var bubbles = messages.querySelectorAll('.msg.assistant .bubble');
    if (!bubbles.length) { alert('还没有可导出的内容'); return; }
    var last = bubbles[bubbles.length - 1];
    var clone = last.cloneNode(true);
    Array.prototype.forEach.call(clone.querySelectorAll('.think, .cursor, .context-tag'), function (n) { n.remove(); });
    var text = clone.textContent.replace(/\n{3,}/g, '\n\n').trim();
    if (!text) { alert('没有可导出的正文'); return; }
    // 标题取最近一条用户消息的前 20 字
    var title = '通用助手导出';
    var userBubbles = messages.querySelectorAll('.msg.user .bubble');
    if (userBubbles.length) {
      var q = userBubbles[userBubbles.length - 1].textContent.trim();
      if (q) title = q.replace(/\s+/g, ' ').slice(0, 20);
    }
    if (!IS_DESKTOP) { alert('浏览器预览模式无法导出，请用桌面应用'); return; }
    window.ingrid.docGenerate({ type: 'docx', title: title, content: text }).then(function (r) {
      if (r && r.ok) alert('已导出：\n' + r.path);
      else alert('导出失败：' + ((r && r.error) || '未知错误'));
    }).catch(function (e) { alert('导出失败：' + String(e && e.message || e)); });
  }

  /* ---------- 事件 ---------- */
  sendBtn.addEventListener('click', send);
  bindImageInputs();
  el('micBtn').addEventListener('click', toggleVoice);
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
  input.addEventListener('input', autoGrow);
  el('clearBtn').addEventListener('click', function () { newChat(); setContextTag(''); });

  // 新对话 + 会话内检索
  el('newChatBtn').addEventListener('click', newChat);
  var searchInput = el('searchInput');
  searchInput.addEventListener('input', function () { doSearch(searchInput.value); });
  searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); jumpSearch(e.shiftKey ? searchIndex - 1 : searchIndex + 1); }
  });
  el('searchPrev').addEventListener('click', function () { jumpSearch(searchIndex - 1); });
  el('searchNext').addEventListener('click', function () { jumpSearch(searchIndex + 1); });
  el('searchModeBtn').addEventListener('click', function () {
    searchMode = searchMode === 'all' ? 'session' : 'all';
    updateModeBtn();
    doSearch(currentQuery);
  });
  el('backupBtn').addEventListener('click', function () {
    if (!IS_DESKTOP) { alert('浏览器预览模式无法备份，请用桌面应用'); return; }
    window.ingrid.chatBackup().then(function (r) {
      if (r && r.ok) alert('已备份 ' + r.count + ' 个会话文件到：\n' + r.path);
      else alert('备份失败：' + ((r && r.error) || '未知错误'));
    }).catch(function (e) { alert('备份失败：' + String(e && e.message || e)); });
  });

  // 批量授权开关
  el('batchAuthBtn').addEventListener('click', function () {
    setBatchAuth(writeAuthMode !== 'session');
  });
  el('exportBtn').addEventListener('click', exportWord);
  el('webBtn').addEventListener('click', function () {
    webEnabled = !webEnabled;
    el('webBtn').classList.toggle('active', webEnabled);
    el('footNote').textContent = webEnabled
      ? '联网搜索已开 · 提问时先检索实时信息 · 本地 Ollama 免费'
      : '联网搜索已关 · 本地 Ollama 免费 · 云端 API 需在「引擎设置」配 Key';
  });

  /* ---------- 启动 ---------- */
  setLogo();
  loadSoul();
  loadEngines();
  loadSessions();
  el('webBtn').classList.add('active');
  applySidebarWidth();
  initSidebarResize();
  updateModeBtn();
  input.focus();
})();
</script>
</body>
