<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent 架构图 · Ingrid's AI Agents</title>
<style>
  :root{
    --bg:#f7f7f5; --card:#ffffff; --ink:#1f1f1f; --muted:#8a8a86;
    --line:#e4e4e0; --blue:#185FA5; --blue-bg:#E6F1FB;
    --purple:#534AB7; --purple-bg:#EEEDFE; --gray-bg:#F1EFE8; --gray-ink:#5F5E5A;
    --amber:#BA7517; --green:#0F6E56; --red:#A32D2D;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;font-size:14px;}
  .wrap{max-width:980px;margin:0 auto;padding:20px 16px 48px;}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  header h1{font-size:18px;font-weight:600;margin:0;}
  header .sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .statbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px;}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
  .stat .k{font-size:11px;color:var(--muted);}
  .stat .v{font-size:17px;font-weight:600;margin-top:4px;}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;}
  .dot.on{background:var(--green);} .dot.off{background:var(--red);}
  .svg-wrap{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;overflow-x:auto;}
  svg{display:block;}
  .lbl{font-size:12px;font-weight:600;fill:var(--muted);}
  .nm{font-size:12.5px;font-weight:600;}
  .du{font-size:10.5px;fill:var(--muted);}
  .mo{font-size:10px;fill:var(--muted);}
  .own{font-size:10px;fill:var(--purple);}
  .zone{fill:none;stroke:var(--line);stroke-width:1;}
  .edge-data{fill:none;stroke:#85B7EB;stroke-width:1.2;stroke-dasharray:6 6;}
  .edge-own{fill:none;stroke:#AFA9EC;stroke-width:1.2;stroke-dasharray:2 4;}
  .flow{animation:dashflow 1.1s linear infinite;}
  .flow-fast{animation:dashflow 0.45s linear infinite;}
  @keyframes dashflow{to{stroke-dashoffset:-12;}}
  .node-active{animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .node-active rect{stroke:var(--amber);stroke-width:2;}
  @media (prefers-reduced-motion:reduce){.flow,.flow-fast,.node-active{animation:none;}}
  .legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--muted);margin-top:12px;}
  .legend span{display:flex;align-items:center;gap:6px;}
  .models{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px;}
  .chip{font-size:12px;padding:3px 9px;border-radius:20px;background:var(--gray-bg);color:var(--gray-ink);}
  .chip.live{background:var(--amber);color:#fff;}
  footer{font-size:12px;color:var(--muted);margin-top:12px;text-align:right;}
</style>
</head>
<body>

<script>
(function(){
  var IS_DESKTOP = !!(window.ingrid && window.ingrid.archStatus);

  var MODEL_AGENT_MAP = [
    { re: /uncensored/i,     nodes: ['n-ethics','p1'] },
    { re: /bge-m3/i,         nodes: ['p3'] },
    { re: /qwen2\.5vl/i,     nodes: ['n-computer','n-cubackend'] },
    { re: /deepseek-r1/i,    nodes: ['n-dev'] },
    { re: /qwen3\.8-16k/i,   nodes: ['p2'] },
    { re: /qwen3\.8:27b/i,   nodes: ['n-assistant','n-meeting','n-mtbackend'] },
    { re: /qwen3:32b(?!-)/i, nodes: ['n-knowledge'] }
  ];

  function el(id){ return document.getElementById(id); }

  function clearActive(){
    var list = document.querySelectorAll('.node-active');
    for (var i=0;i<list.length;i++) list[i].classList.remove('node-active');
    var fast = document.querySelectorAll('.flow-fast');
    for (var j=0;j<fast.length;j++) fast[j].classList.remove('flow-fast');
  }

  function setNodeActive(id){
    var n = el(id); if (n) n.classList.add('node-active');
  }

  function fmtTime(ts){
    var d = new Date(ts), p = function(x){ return String(x).padStart(2,'0'); };
    return p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
  }

  function render(s){
    if (!s) { el('foot').textContent = '无法获取状态（非桌面环境，请在工作台内打开）'; return; }

    el('lastRefresh').textContent = '更新于 ' + fmtTime(s.now);

    var dot = el('ollamaDot');
    if (s.ollamaOnline){ dot.className = 'dot on'; el('ollamaState').textContent = '在线'; }
    else { dot.className = 'dot off'; el('ollamaState').textContent = '离线'; }

    el('ethicsProg').textContent = s.ethics.total ? (s.ethics.done + ' / ' + s.ethics.total + (s.ethics.running ? ' · 运行中' : '')) : '—';
    el('legalCount').textContent = s.legal.laws ? (s.legal.laws + ' 条') : '—';
    el('sceneCount').textContent = s.sceneFiles ? (s.sceneFiles + ' 个') : '—';

    var chips = el('modelChips'); chips.innerHTML = '';
    if (s.ollamaOnline && s.activeModels.length){
      s.activeModels.forEach(function(m){
        var c = document.createElement('span');
        c.className = 'chip live'; c.textContent = 'GPU 活跃 · ' + m.name;
        chips.appendChild(c);
      });
    } else if (s.ollamaOnline){
      var c = document.createElement('span'); c.className = 'chip'; c.textContent = '无模型加载（空闲）';
      chips.appendChild(c);
    } else {
      var c2 = document.createElement('span'); c2.className = 'chip'; c2.textContent = 'Ollama 离线';
      chips.appendChild(c2);
    }

    clearActive();
    if (s.ollamaOnline){
      var hit = {};
      s.activeModels.forEach(function(m){
        MODEL_AGENT_MAP.forEach(function(rule){
          if (rule.re.test(m.name)){ rule.nodes.forEach(function(id){ hit[id] = true; }); }
        });
      });
      Object.keys(hit).forEach(function(id){ setNodeActive(id); });
      if (Object.keys(hit).length){
        ['wf-ethics','wf-p1','wf-p2','wf-p3','wf-write'].forEach(function(id){ var e = el(id); if (e) e.classList.add('flow-fast'); });
      }
    }

    var activeCount = document.querySelectorAll('.node-active').length;
    el('foot').textContent = s.ollamaOnline
      ? (activeCount ? ('检测到 ' + activeCount + ' 个 agent 正在工作（模型活跃）') : 'Ollama 在线 · 所有 agent 待机')
      : 'Ollama 离线 · 本地模型 agent 待机';
  }

  function poll(){
    if (!IS_DESKTOP) return;
    window.ingrid.archStatus().then(render).catch(function(e){ el('foot').textContent = '状态获取失败：' + (e && e.message || e); });
  }

  document.querySelectorAll('.edge-data').forEach(function(e){ e.classList.add('flow'); });
  if (IS_DESKTOP){ poll(); setInterval(poll, 3000); }
  else { render(null); }
})();
</script>
</body>
</html>
