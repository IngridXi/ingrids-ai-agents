<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>研究助手 · Ingrid's AI Agents</title>
<style>
  :root {
    --accent: #7c6fd6;      /* 柔和高级紫 主紫 */
    --accent-2: #6355c4;    /* hover/按下 */
    --accent-soft: #ebe7f7; /* 浅紫底 */
    --deep: #4a3f8c;        /* 渐变深端 */
    --ink: #26232e;         /* 主文字 */
    --ink-soft: #55515e;    /* 次要文字 */
    --ink-faint: #8f8b98;   /* 禁用/占位 */
    --line: #e6e4ec;        /* 分割线 */
    --bg: #f7f6f9;          /* 页面底 */
    --card: #ffffff;        /* 卡片底 */
    --danger: #dc2626;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink);
    display: flex; flex-direction: row; overflow: hidden;
  }

  /* 布局：左侧会话栏 + 右侧聊天区 */
  .layout { display: flex; flex: 1; min-height: 0; width: 100%; }
  .sidebar {
    flex: none; width: 264px; background: #f1eff6; border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0; position: relative;
  }
  .sidebar .sb-head { padding: 12px 12px 8px; }
  #newChatBtn {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--accent-2); font-size: 13.5px; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  #newChatBtn:hover { background: var(--accent-soft); border-color: var(--accent); }
  .sidebar .sb-search { padding: 0 12px 10px; display: flex; gap: 6px; align-items: center; }
  .sidebar .sb-search input {
    flex: 1; min-width: 0; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line);
    font-size: 12.5px; background: var(--card); outline: none; color: var(--ink);
  }
  .sidebar .sb-search input:focus { border-color: var(--accent); }
  #searchCount { font-size: 11px; color: var(--ink-faint); min-width: 36px; text-align: center; flex: none; }
  .sidebar .sb-search button {
    flex: none; width: 26px; height: 26px; border: 1px solid var(--line); border-radius: 7px;
    background: var(--card); color: var(--ink-soft); cursor: pointer; font-size: 12px; line-height: 1;
  }
  .sidebar .sb-search button:hover { border-color: var(--accent); color: var(--accent); }
  #sessionList { flex: 1; overflow-y: auto; padding: 4px 8px 12px; }
  .session {
    display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 9px;
    cursor: pointer; margin-bottom: 2px;
  }
  .session:hover { background: #e9e6f1; }
  .session.active { background: var(--card); box-shadow: 0 1px 4px rgba(40,32,70,.10); }
  .session .s-title { flex: 1; min-width: 0; font-size: 13px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session .s-time { font-size: 11px; color: var(--ink-faint); flex: none; }
  .session .s-del {
    flex: none; width: 20px; height: 20px; border: none; background: none; color: var(--ink-faint);
    cursor: pointer; font-size: 13px; border-radius: 5px; display: none; line-height: 1; padding: 0;
  }
  .session:hover .s-del { display: block; }
  .session .s-del:hover { color: var(--danger); background: #fbe7e7; }
  .session .s-rename { flex: 1; min-width: 0; font-size: 13px; padding: 2px 4px; border: 1px solid var(--accent); border-radius: 5px; outline: none; background: #fff; color: var(--ink); }
  .search-empty { padding: 14px 12px; font-size: 12.5px; color: var(--ink-faint); text-align: center; }
  #searchModeBtn {
    flex: none; padding: 0 8px; height: 26px; border: 1px solid var(--line); border-radius: 7px;
    background: var(--card); color: var(--ink-soft); cursor: pointer; font-size: 12px; line-height: 1;
    white-space: nowrap; flex-shrink: 0;
  }
  #searchModeBtn:hover { border-color: var(--accent); color: var(--accent); }
  #searchModeBtn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-2); }
  .sb-search-2 { padding: 0 12px 8px; display: flex; gap: 6px; align-items: center; }
  .sb-search-2 #searchCount { flex: 1; text-align: left; }
  .resize-handle { position: absolute; top: 0; right: -3px; width: 6px; height: 100%; cursor: col-resize; z-index: 10; }
  .sidebar .sb-foot { padding: 8px 12px 12px; border-top: 1px solid var(--line); }
  #backupBtn { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink-soft); font-size: 12px; cursor: pointer; }
  #backupBtn:hover { border-color: var(--accent); color: var(--accent); }
  .session .s-pin { flex: none; width: 20px; height: 20px; border: none; background: none; color: var(--ink-faint); cursor: pointer; font-size: 13px; border-radius: 5px; display: none; line-height: 1; padding: 0; }
  .session:hover .s-pin { display: block; }
  .session.pinned .s-pin { display: block; color: var(--accent-2); }
  .session .s-pin:hover { color: var(--accent); }
  .msg .copy-btn {
    position: absolute; top: 6px; right: 12px; padding: 3px 9px; font-size: 11px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink-soft);
    cursor: pointer; opacity: 0; transition: opacity .12s; z-index: 5;
  }
  .msg.assistant:hover .copy-btn { opacity: 1; }
  .msg .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
  .main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  /* 会话内检索高亮 */
  mark.search-hit { background: #ffe08a; color: #4a3200; border-radius: 2px; padding: 0 1px; }
  .msg.search-active .bubble { box-shadow: 0 0 0 2px #f5b942; }

  /* 顶栏 */
  header {
    flex: none; display: flex; align-items: center; gap: 12px;
    padding: 14px 20px; background: linear-gradient(120deg, var(--accent), var(--deep)); color: #fff;
    box-shadow: 0 2px 12px rgba(74,63,140,.18); position: relative;
  }
  header .logo {
    width: 36px; height: 36px; border-radius: 10px; background: rgba(255,255,255,.18);
    display: grid; place-items: center; flex: none;
  }
  header .logo svg { width: 20px; height: 20px; }
  header .title { font-size: 16px; font-weight: 700; line-height: 1.2; }
  header .title .sub { font-size: 11.5px; font-weight: 400; opacity: .82; }
  header .spacer { flex: 1; }
  header select {
    padding: 7px 10px; border-radius: 9px; border: 1px solid rgba(255,255,255,.35);
    background: rgba(255,255,255,.16); color: #fff; font-size: 13px; cursor: pointer; outline: none;
  }
  header select option { color: var(--ink); background: #fff; }
  #modelHint {
    max-width: 220px; min-width: 0; flex-shrink: 1; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; font-size: 10.5px; opacity: .82; color: #fff; line-height: 1.2;
  }
  header .clear-btn {
    padding: 7px 12px; border-radius: 9px; border: 1px solid rgba(255,255,255,.35);
    background: rgba(255,255,255,.14); color: #fff; font-size: 13px; cursor: pointer;
  }
  header .clear-btn:hover { background: rgba(255,255,255,.24); }
  header .clear-btn.active { background: rgba(255,255,255,.34); border-color: rgba(255,255,255,.8); }

  /* 消息区 */
  #messages { flex: 1; overflow-y: auto; padding: 22px 20px 10px; scroll-behavior: smooth; }
  .msg { display: flex; margin-bottom: 18px; position: relative; }
  .msg .avatar {
    width: 34px; height: 34px; border-radius: 10px; flex: none;
    display: grid; place-items: center; font-size: 15px;
  }
  .msg.user { flex-direction: row-reverse; }
  .msg.user .avatar { background: var(--accent); color: #fff; }
  .msg.user .avatar svg { width: 18px; height: 18px; }
  .msg.assistant .avatar { background: var(--accent-soft); color: var(--accent); }
  .msg.assistant .avatar svg { width: 19px; height: 19px; }
  .msg .bubble {
    max-width: 74%; padding: 11px 14px; border-radius: 14px;
    font-size: 14px; line-height: 1.65; white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; margin-right: 10px; }
  .msg.assistant .bubble { background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 4px; margin-left: 10px; white-space: normal; }

  /* Markdown 富文本样式（assistant 气泡内） */
  .msg.assistant .bubble p { margin: 0 0 8px; }
  .msg.assistant .bubble p:last-child { margin-bottom: 0; }
  .msg.assistant .bubble h1, .msg.assistant .bubble h2, .msg.assistant .bubble h3, .msg.assistant .bubble h4 {
    margin: 12px 0 6px; font-weight: 700; line-height: 1.35; color: var(--ink);
  }
  .msg.assistant .bubble h1 { font-size: 18px; }
  .msg.assistant .bubble h2 { font-size: 16px; }
  .msg.assistant .bubble h3 { font-size: 15px; }
  .msg.assistant .bubble h4 { font-size: 14px; }
  .msg.assistant .bubble ul, .msg.assistant .bubble ol { margin: 6px 0; padding-left: 22px; }
  .msg.assistant .bubble li { margin: 3px 0; }
  .msg.assistant .bubble code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
    background: var(--accent-soft); color: var(--accent-2); padding: 1px 5px; border-radius: 5px;
  }
  .msg.assistant .bubble pre {
    background: #2b2733; color: #e8e6ef; padding: 12px 14px; border-radius: 10px;
    overflow-x: auto; margin: 10px 0; line-height: 1.5;
  }
  .msg.assistant .bubble pre code { background: transparent; color: inherit; padding: 0; font-size: 12.5px; }
  .msg.assistant .bubble blockquote {
    border-left: 3px solid var(--accent); padding: 4px 12px; margin: 8px 0;
    color: var(--ink-soft); background: var(--accent-soft); border-radius: 0 8px 8px 0;
  }
  .msg.assistant .bubble table { border-collapse: collapse; margin: 10px 0; font-size: 13px; display: block; overflow-x: auto; }
  .msg.assistant .bubble th, .msg.assistant .bubble td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
  .msg.assistant .bubble th { background: var(--accent-soft); font-weight: 600; }
  .msg.assistant .bubble hr { border: none; border-top: 1px solid var(--line); margin: 12px 0; }
  .msg.assistant .bubble a { color: var(--accent-2); text-decoration: underline; }
  .msg.assistant .bubble .mermaid { margin: 10px 0; text-align: center; overflow-x: auto; }
  .msg.assistant .bubble .mermaid svg { max-width: 100%; height: auto; }
  .msg.assistant .bubble .mmd-err { color: var(--danger); font-size: 12px; }
  .msg .bubble.err { border-color: #f3c2c0; background: #fdf2f2; color: #b3261e; }
  .msg .bubble .cursor { display: inline-block; width: 8px; height: 15px; background: var(--accent); vertical-align: -2px; margin-left: 1px; border-radius: 2px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .msg .bubble .think {
    font-size: 12.5px; color: var(--ink-soft); background: var(--accent-soft);
    border-radius: 8px; padding: 8px 11px; margin-bottom: 9px; line-height: 1.55;
  }
  .msg .bubble .think summary { cursor: pointer; font-weight: 600; color: var(--accent-2); user-select: none; margin-bottom: 4px; }
  .msg .bubble .status-line { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-soft); }
  .msg .bubble .status-line .dots { display: inline-flex; gap: 3px; }
  .msg .bubble .status-line .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); display: inline-block; animation: blink 1.2s infinite; }
  .msg .bubble .status-line .dots i:nth-child(2) { animation-delay: .2s; }
  .msg .bubble .status-line .dots i:nth-child(3) { animation-delay: .4s; }
  .msg.user .bubble .engine-note { margin-top: 8px; padding: 6px 10px; font-size: 12px; line-height: 1.5; color: var(--accent-2); background: rgba(126,108,209,.10); border-radius: 8px; }

  /* 写操作审批卡片 */
  .approval-card {
    max-width: 640px; margin: 8px 0 8px 48px; padding: 12px 14px;
    background: #fffdf6; border: 1px solid #f0d9a8; border-left: 3px solid #e0a63c;
    border-radius: 12px; font-size: 13px; line-height: 1.55;
  }
  .approval-card .ap-head { display: flex; align-items: center; gap: 8px; font-weight: 600; color: #8a5a12; margin-bottom: 6px; }
  .approval-card .ap-icon { font-size: 16px; }
  .approval-card .ap-body { color: var(--ink); font-family: ui-monospace, Menlo, monospace; font-size: 12px; word-break: break-all; margin-bottom: 6px; }
  .approval-card .ap-extra { color: var(--ink-soft); background: #fbf6ea; border-radius: 8px; padding: 8px 10px; font-size: 12px; word-break: break-all; max-height: 120px; overflow: auto; margin-bottom: 8px; white-space: pre-wrap; }
  .approval-card .ap-actions { display: flex; gap: 8px; }
  .approval-card .ap-actions button {
    flex: 1; padding: 8px 0; border-radius: 9px; border: 1px solid var(--line);
    cursor: pointer; font-size: 13px; font-weight: 600; background: var(--card);
  }
  .approval-card .ap-yes { border-color: #3f9d5a !important; color: #2c7a41; }
  .approval-card .ap-yes:hover { background: #eaf7ee; }
  .approval-card .ap-no { border-color: #e0a2a2 !important; color: #b3261e; }
  .approval-card .ap-no:hover { background: #fdf2f2; }
  .approval-card.decided { opacity: 0.6; }
  .approval-card.decided button { cursor: default; pointer-events: none; }
  .approval-card .ap-all { border-color: #4a7dd6 !important; color: #2b5fa8; }
  .approval-card .ap-all:hover { background: #eaf1fb; }

  /* 批量授权：已自动执行标记 */
  .auto-exec {
    max-width: 640px; margin: 4px 0 4px 48px; padding: 6px 12px;
    font-size: 12px; color: #2c7a41; background: #eaf7ee;
    border: 1px solid #bfe3ca; border-radius: 8px; line-height: 1.5; word-break: break-all;
  }

  /* 欢迎态 */
  .welcome { text-align: center; color: var(--ink-soft); padding: 40px 16px 20px; }
  .welcome .big { width: 60px; height: 60px; border-radius: 18px; background: linear-gradient(135deg, var(--accent), var(--deep)); color: #fff; display: grid; place-items: center; margin: 0 auto 14px; }
  .welcome .big svg { width: 30px; height: 30px; }
  .welcome h2 { font-size: 17px; color: var(--ink); margin-bottom: 6px; }
  .welcome p { font-size: 13px; margin-bottom: 14px; }
  .welcome .hints { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .welcome .hint {
    padding: 7px 12px; border-radius: 20px; border: 1px solid var(--line);
    background: var(--card); font-size: 12.5px; color: var(--ink-soft); cursor: pointer;
  }
  .welcome .hint:hover { border-color: var(--accent); color: var(--accent); }

  /* 底部输入区 */
  footer {
    flex: none; padding: 12px 20px 16px; background: var(--bg); border-top: 1px solid var(--line);
  }
  .input-row { display: flex; align-items: flex-end; gap: 10px; max-width: 900px; margin: 0 auto; }
  textarea {
    flex: 1; resize: none; min-height: 44px; max-height: 160px;
    padding: 11px 14px; border: 1px solid var(--line); border-radius: 14px;
    font-size: 14px; line-height: 1.5; font-family: inherit; color: var(--ink);
    background: var(--card); outline: none;
  }
  textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  #sendBtn {
    flex: none; width: 44px; height: 44px; border: none; border-radius: 14px;
    background: var(--accent); color: #fff; cursor: pointer; display: grid; place-items: center;
  }
  #sendBtn:hover { background: var(--accent-2); }
  #sendBtn:disabled { background: #c9c4e0; cursor: not-allowed; }
  #sendBtn.stop { background: var(--danger, #d64545); }
  #sendBtn.stop:hover { background: #c03636; }
  #sendBtn svg { width: 20px; height: 20px; }
  .tool-btn {
    flex: none; width: 40px; height: 44px; border: 1px solid var(--line); border-radius: 14px;
    background: var(--card); color: var(--ink-soft); cursor: pointer; display: grid; place-items: center;
  }
  .tool-btn:hover { border-color: var(--accent); color: var(--accent); }
  .tool-btn svg { width: 19px; height: 19px; }
  .tool-btn.rec { background: #fdecec; border-color: var(--danger); color: var(--danger); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
  .img-preview { display: flex; gap: 8px; align-items: center; max-width: 900px; margin: 8px auto 0; padding: 6px 8px; background: var(--surface-2); border: 1px dashed var(--line); border-radius: 10px; }
  .img-preview img { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
  .img-preview .nm { font-size: 12px; color: var(--ink-soft); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .img-preview .x { border: none; background: none; color: var(--ink-faint); cursor: pointer; font-size: 16px; }
  .img-preview .x:hover { color: var(--danger); }
  .user-img { margin-bottom: 8px; }
  .user-img img { max-width: 220px; max-height: 180px; border-radius: 10px; display: block; }
  .foot-note { text-align: center; font-size: 11px; color: var(--ink-faint); margin-top: 8px; }

  /* 知识库面板 */
  .kb-badge { font-size: 11px; padding: 1px 7px; border-radius: 10px; background: rgba(255,255,255,.22); color: #fff; }
  .kb-panel {
    position: absolute; top: 60px; right: 20px; width: 340px; z-index: 30;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 10px 34px rgba(30,26,50,.18); padding: 15px; text-align: left;
  }
  .kb-panel .kb-title { font-size: 13px; font-weight: 600; margin-bottom: 11px; display: flex; align-items: center; gap: 7px; color: var(--ink); }
  .kb-panel .kb-row { margin-bottom: 11px; font-size: 12.5px; color: var(--ink-soft); line-height: 1.6; }
  .kb-panel label { display: flex; align-items: center; gap: 7px; cursor: pointer; color: var(--ink); }
  .kb-panel .kb-status .ok { color: #1d9e75; font-weight: 600; }
  .kb-panel .kb-status .warn { color: #b7791f; font-weight: 600; }
  .kb-panel .kb-actions { display: flex; align-items: center; gap: 10px; }
  .kb-btn {
    padding: 6px 13px; border: none; border-radius: 8px;
    background: var(--accent); color: #fff; font-size: 12.5px; cursor: pointer;
  }
  .kb-btn:hover { background: var(--accent-2); }
  .kb-btn:disabled { background: #c9c4e0; cursor: wait; }
  .kb-hint { font-size: 11px; color: var(--ink-faint); }

  /* 审稿闭环 */
  .review-btn.active { background: rgba(255,255,255,.34); border-color: rgba(255,255,255,.8); }
  .phase-tag {
    display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 9px;
    border-radius: 8px; margin-bottom: 7px; letter-spacing: .3px;
  }
  .phase-tag.draft { background: #e6f1fb; color: #185fa5; }
  .phase-tag.revise { background: #e1f5ee; color: #0f6e56; }
  .review-block {
    font-size: 13px; color: #6b5320; background: #faf3e3; border: 1px solid #f0dcae;
    border-radius: 10px; padding: 10px 12px; line-height: 1.6;
  }
  .review-block summary { cursor: pointer; font-weight: 600; color: #854f0b; user-select: none; margin-bottom: 4px; }
  .loop-status { font-size: 12px; color: var(--ink-faint); text-align: center; margin: 2px 0 14px; }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sb-head"><button id="newChatBtn">＋ 新对话</button></div>
    <div class="sb-search">
      <input id="searchInput" type="text" placeholder="搜索消息">
      <button id="searchModeBtn" title="本会话 / 全局搜索切换">本会话</button>
    </div>
    <div class="sb-search sb-search-2">
      <span id="searchCount"></span>
      <button id="searchPrev" title="上一条">↑</button>
      <button id="searchNext" title="下一条">↓</button>
    </div>
    <div id="sessionList"></div>
    <div class="sb-foot"><button id="backupBtn" title="把全部聊天记录导出为一个 JSON 备份文件">⤓ 备份全部对话</button></div>
    <div class="resize-handle"></div>
  </aside>
  <div class="main-col">
<header>
  <div class="logo" id="logo"></div>
  <div class="title">
    研究助手
    <div class="sub">Research RA · 读博日常主力</div>
  </div>
  <div class="spacer"></div>
  <select id="engineSelect" title="选择聊天引擎"></select>
  <select id="modelSelect" title="选择模型"></select>
  <span id="modelHint" title=""></span>
  <button class="clear-btn" id="kbBtn" title="本地知识库">知识库 <span class="kb-badge" id="kbBadge">–</span></button>
  <button class="clear-btn" id="webBtn" title="联网搜索（提问时自动检索实时信息，研究助手默认关以保持「只依据证据」）">联网</button>
  <button class="clear-btn" id="reviewBtn" title="产出→审稿→返修，对抗式闭环">审稿闭环</button>

<script src="../../vendor/marked.min.js"></script>
<script src="../../vendor/mermaid.min.js"></script>

<script src="../../icons.js"></script>
<script>
(function () {
  'use strict';
  var IS_DESKTOP = !!(window.ingrid && window.ingrid.isDesktop);

  /* ---------- Markdown 渲染 + Mermaid 图表（ChatGPT 式富文本） ---------- */
  if (typeof marked !== 'undefined') {
    marked.setOptions({ gfm: true, breaks: true });
  }
  if (typeof mermaid !== 'undefined') {
    try { mermaid.initialize({ startOnLoad: false, theme: 'base', securityLevel: 'loose' }); } catch (e) {}
  }
  var __mmdSeq = 0;
  var __mmdMap = {};
  function mdToHtml(text) {
    var s = String(text == null ? '' : text);
    var blocks = [];
    s = s.replace(/```mermaid\s*\n([\s\S]*?)```/g, function (m, code) {
      var id = 'mmd' + (++__mmdSeq);
      __mmdMap[id] = code.trim();
      blocks.push(id);
      return '<!--' + id + '-->';
    });
    var html;
    try { html = marked.parse(s); }
    catch (e) { html = esc(s); }
    blocks.forEach(function (id) {
      html = html.replace('<!--' + id + '-->', '<div class="mermaid" data-mmd="' + id + '"></div>');
    });
    return html;
  }
  function renderMermaidIn(container) {
    if (!container || typeof mermaid === 'undefined') return;
    var nodes = container.querySelectorAll('.mermaid[data-mmd]');
    for (var i = 0; i < nodes.length; i++) {
      (function (node) {
        var id = node.getAttribute('data-mmd');
        var src = __mmdMap[id];
        if (!src || node.getAttribute('data-rendered')) return;
        node.setAttribute('data-rendered', '1');
        var uniq = 'mmd-g-' + id + '-' + Math.random().toString(36).slice(2, 8);
        mermaid.render(uniq, src).then(function (res) {
          node.innerHTML = res.svg;
          node.classList.add('rendered');
        }).catch(function (err) {
          node.innerHTML = '<pre class="mmd-err">图表渲染失败：' + esc(String((err && err.message) || err)) + '</pre>';
        });
      })(nodes[i]);
    }
  }

  // 研究助手的 soul（若 agents.json 里没有则回退到内置值）
  var SOUL_FALLBACK = '你是研究助手（Research RA），Ingrid 读博阶段的日常主力。铁律：只依据给定证据与材料作答，结构化输出，不臆造文献、数据、作者与页码；缺来源时标注 [需补引]。先澄清研究问题（最多 3 问），再给一条核心判断、依据与风险、下一步最小可完成动作。不做代写、不替用户决定选题。';
  var soul = SOUL_FALLBACK;
  var systemPrompt = soul;

  // 引擎元信息（与 main.js CHAT_ENDPOINTS 对齐）
  var ENGINE_META = {
    ollama:   { label: '本地 Ollama · qwen3:32b（免费）' },
    'ollama-vision': { label: '本地视觉模型 · qwen2.5vl:7b（识图）' },
    deepseek: { label: 'DeepSeek · API Key' },
    gpt:      { label: 'GPT · API Key' },
    qwen:     { label: 'Qwen · API Key' },
  };

  // 各引擎可选模型 + 用途说明（id 与 main.js 实际请求的 model 名对齐）
  var ENGINE_MODELS = {
    ollama: [
      { id: 'qwen3:32b', label: 'qwen3:32b · 通用', desc: '本地免费 · 日常问答 / 综述 / 写作' },
    ],
    'ollama-vision': [
      { id: 'qwen2.5vl:7b', label: 'qwen2.5vl:7b · 识图', desc: '本地视觉模型 · 看图 / OCR / 截图提问' },
    ],
    deepseek: [
      { id: 'deepseek-flash', label: 'Flash · 快 / 便宜', desc: '日常聊天、文献综述、工具调用、RAG；速度快、最便宜（不支持图片）' },
      { id: 'deepseek-v4-pro', label: 'V4-Pro · 深度推理', desc: '最难推理、长链路编程与数学难题；更强但更贵更慢' },
    ],
    gpt: [
      { id: 'gpt-4o-mini', label: 'gpt-4o-mini · 通用', desc: '通用对话 · 性价比高' },
    ],
    qwen: [
      { id: 'qwen-plus', label: 'qwen-plus · 通用', desc: '通义千问 · 通用对话' },
    ],
  };

  // 会话状态
  var history = [];      // [{role:'user'|'assistant', content}]
  var streaming = false;
  var stopRequested = false;   // 用户点了「停止生成」
  var writeAuthMode = 'per-item';  // 'per-item' 逐个审批 | 'session' 会话级批量授权

  /* ---------- 记忆持久化 + 工具能力（能力化：每个 Agent 都能挂文件/数据库/电脑操作） ---------- */
  var AGENT_NAME = '研究助手';
  var MAX_TOOL_ROUNDS = 3;

  function agentCapabilities() {
    var caps = { fs: false, db: false, computer: false };
    try {
      var agents = IS_DESKTOP ? window.ingrid.loadAgentsSync() : [];
      for (var i = 0; i < agents.length; i++) {
        if (agents[i].name === AGENT_NAME) {
          // v9：复用 agents-core.js 的声明式能力归一化（caps + tools + computer 一处定义）
          var C = window.AgentsCore;
          if (C && C.resolveCapabilities) {
            var full = C.resolveCapabilities(agents[i]);
            caps.fs = !!full.fs; caps.db = !!full.db; caps.computer = !!full.computer;
          } else {
            var t = agents[i].tools || [];
            caps.fs = t.indexOf('fs') >= 0;
            caps.db = t.indexOf('db') >= 0;
            caps.computer = agents[i].computer === 'on' || agents[i].computer === true;
          }
          break;
        }
      }
    } catch (e) {}
    return caps;
  }
  function serializeHistory(h) {
    return (h || []).map(function (m) {
      var c = m.content;
      if (Array.isArray(c)) {
        var txt = c.map(function (p) {
          if (p && p.text) return p.text;
          if (p && p.type === 'image_url') return '[图片]';
          return '';
        }).filter(Boolean).join(' ');
        c = txt || '[图片]';
      }
      return { role: m.role, content: String(c == null ? '' : c) };
    });
  }
  /* ---------- 多会话：聊天记录列表 + 新对话 + 会话内检索 ---------- */
  var sessions = [];      // [{ id, title, createdAt, updatedAt, messages: [] }]
  var activeId = null;
  var searchMatches = []; // 命中消息的 DOM 节点
  var searchIndex = -1;
  var searchMode = 'session'; // 'session' | 'all'
  var currentQuery = '';

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function currentSession() {
    for (var i = 0; i < sessions.length; i++) if (sessions[i].id === activeId) return sessions[i];
    return null;
  }
  function sessionById(id) {
    for (var i = 0; i < sessions.length; i++) if (sessions[i].id === id) return sessions[i];
    return null;
  }
  function serializeSession(s) {
    return { id: s.id, title: s.title, createdAt: s.createdAt, updatedAt: s.updatedAt, pinned: !!s.pinned, messages: serializeHistory(s.messages) };
  }
  function persistSessions() {
    if (!IS_DESKTOP) return;
    try { window.ingrid.chatHistorySave(AGENT_NAME, { v: 2, sessions: sessions.map(serializeSession), activeId: activeId }); } catch (e) {}
  }
  function touchCurrentSession() {
    var s = currentSession();
    if (!s) return;
    s.updatedAt = Date.now();
    if (s.title === '新对话') {
      for (var i = 0; i < s.messages.length; i++) {
        var m = s.messages[i];
        if (m.role === 'user' && m.content) {
          var t = String(m.content).replace(/\s+/g, ' ').trim();
          if (t) { s.title = t.slice(0, 24); break; }
        }
      }
    }
  }
  // 对话结束后异步用引擎生成一个简短中文标题（≤12字），比截取原文更符合「总结题目」的预期
  var __autoTitleBusy = {};
  function autoTitle(session) {
    if (!IS_DESKTOP || !session) return;
    if (__autoTitleBusy[session.id]) return;
    var q = '';
    for (var i = 0; i < session.messages.length; i++) {
      var m = session.messages[i];
      if (m.role === 'user' && m.content) {
        q = String(m.content).replace(/\s+/g, ' ').trim().slice(0, 200);
        break;
      }
    }
    if (!q) return;
    __autoTitleBusy[session.id] = true;
    var engine = engineSelect.value || 'ollama';
    var acc = '';
    window.ingrid.chatStream({
      engine: engine,
      model: currentModelId(),
      messages: [
        { role: 'system', content: '你是会话标题生成器。根据用户的问题，生成一个不超过 12 个字的简洁中文标题，概括主题。只输出标题本身，不要引号、书名号、标点、序号、解释或任何前后缀。' },
        { role: 'user', content: q },
      ],
    }, {
      onDelta: function (chunk) { if (chunk && chunk.text) acc += chunk.text; },
      onDone: function (d) {
        __autoTitleBusy[session.id] = false;
        if (!d || !d.ok) return;   // 失败则保留截取标题
        var t = acc.replace(/["'""''【】《》#*\-—\n]/g, '').trim().slice(0, 20);
        if (!t) return;
        session.title = t;
        persistSessions();
        renderSessionList();
      },
    });
  }
  function relTime(ts) {
    var d = Date.now() - (ts || 0);
    if (d < 60000) return '刚刚';
    if (d < 3600000) return Math.floor(d / 60000) + ' 分钟前';
    if (d < 86400000) return Math.floor(d / 3600000) + ' 小时前';
    if (d < 7 * 86400000) return Math.floor(d / 86400000) + ' 天前';
    return new Date(ts).toLocaleDateString('zh-CN');
  }
  function renderSessionList() {
    var box = el('sessionList');
    if (!box) return;
    var sorted = sessions.slice().sort(function (a, b) {
      if ((a.pinned ? 1 : 0) !== (b.pinned ? 1 : 0)) return (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0);
      return (b.updatedAt || 0) - (a.updatedAt || 0);
    });
    box.innerHTML = '';
    sorted.forEach(function (s) {
      var row = document.createElement('div');
      row.className = 'session' + (s.id === activeId ? ' active' : '') + (s.pinned ? ' pinned' : '');
      row.title = '单击切换 · 双击重命名';
      row.innerHTML = '<div class="s-title"></div><div class="s-time"></div><button class="s-pin" title="置顶/取消置顶">📌</button><button class="s-del" title="删除会话">✕</button>';
      row.querySelector('.s-title').textContent = s.title || '新对话';
      row.querySelector('.s-time').textContent = relTime(s.updatedAt || s.createdAt || Date.now());
      row.addEventListener('click', function (e) {
        if (e.target && e.target.classList && (e.target.classList.contains('s-del') || e.target.classList.contains('s-pin'))) return;
        switchSession(s.id);
      });
      row.addEventListener('dblclick', function (e) {
        if (e.target && e.target.classList && (e.target.classList.contains('s-del') || e.target.classList.contains('s-pin'))) return;
        startRename(s.id, row);
      });
      row.querySelector('.s-pin').addEventListener('click', function (e) {
        e.stopPropagation();
        togglePin(s.id);
      });
      row.querySelector('.s-del').addEventListener('click', function (e) {
        e.stopPropagation();
        if (confirm('删除这个对话？')) deleteSession(s.id);
      });
      box.appendChild(row);
    });
  }
  function togglePin(id) {
    var s = sessionById(id);
    if (!s) return;
    s.pinned = !s.pinned;
    persistSessions();
    renderSessionList();
  }
  function startRename(id, row) {
    var s = sessionById(id);
    if (!s) return;
    var titleEl = row.querySelector('.s-title');
    var inp = document.createElement('input');
    inp.className = 's-rename';
    inp.value = s.title || '';
    inp.maxLength = 40;
    titleEl.replaceWith(inp);
    inp.focus(); inp.select();
    var finish = function (save) {
      if (save && s) { var v = inp.value.trim(); if (v) s.title = v; }
      persistSessions();
      renderSessionList();
    };
    inp.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); finish(true); }
      else if (e.key === 'Escape') { finish(false); }
    });
    inp.addEventListener('blur', function () { finish(true); });
  }
  function renderActiveSession() {
    messages.innerHTML = '';
    var s = currentSession();
    if (!s || !s.messages.length) { welcome(); return; }
    s.messages.forEach(function (m) {
      var b = addBubble(m.role, m.role === 'assistant' ? mdToHtml(stripToolMarkers(m.content)) : esc(m.content));
      if (m.role === 'assistant') renderMermaidIn(b);
    });
    messages.scrollTop = messages.scrollHeight;
  }
  function newChat() {
    if (streaming) return;
    var cur = currentSession();
    if (cur && cur.messages.length === 0) { activeId = cur.id; }
    else {
      var s = { id: uid(), title: '新对话', createdAt: Date.now(), updatedAt: Date.now(), messages: [] };
      sessions.push(s); activeId = s.id;
    }
    history = currentSession().messages;
    setBatchAuth(false);
    clearSearch();
    renderSessionList();
    welcome();
    persistSessions();
    input.focus();
  }
  function switchSession(id) {
    if (streaming) return;
    activeId = id;
    var s = currentSession();
    history = s ? s.messages : [];
    clearSearch();
    renderSessionList();
    renderActiveSession();
    persistSessions();
    input.focus();
  }
  function deleteSession(id) {
    if (streaming) return;
    var idx = -1;
    for (var i = 0; i < sessions.length; i++) if (sessions[i].id === id) { idx = i; break; }
    if (idx < 0) return;
    sessions.splice(idx, 1);
    if (!sessions.length) { newChat(); return; }
    if (activeId === id) activeId = sessions[Math.max(0, idx - 1)].id;
    history = currentSession().messages;
    clearSearch();
    renderSessionList();
    renderActiveSession();
    persistSessions();
  }
  function loadSessions() {
    if (!IS_DESKTOP) { newChat(); return; }
    window.ingrid.chatHistoryLoad(AGENT_NAME).then(function (data) {
      var list = null;
      if (Array.isArray(data)) {
        // 旧格式：单条扁平数组 → 迁移为一个会话
        list = [{ id: uid(), title: '历史会话', createdAt: Date.now(), updatedAt: Date.now(), messages: data }];
      } else if (data && Array.isArray(data.sessions)) {
        list = data.sessions.map(function (s) {
          return { id: s.id || uid(), title: s.title || '新对话', createdAt: s.createdAt || Date.now(), updatedAt: s.updatedAt || Date.now(), pinned: !!s.pinned, messages: Array.isArray(s.messages) ? s.messages : [] };
        });
        activeId = data.activeId;
      }
      sessions = (list && list.length) ? list : [];
      // 一次性清洗历史消息里残留的 DSML / 工具标记（旧版本写入的脏数据），并回写持久化
      var _cleaned = false;
      sessions.forEach(function (s) {
        (s.messages || []).forEach(function (m) {
          if (m.role === 'assistant' && m.content) {
            var c = stripToolMarkers(m.content);
            if (c !== m.content) { m.content = c; _cleaned = true; }
          }
        });
      });
      if (_cleaned) { try { window.ingrid.chatHistorySave(AGENT_NAME, { v: 2, sessions: sessions.map(serializeSession), activeId: activeId }); } catch (e) {} }
      if (!sessions.length) { newChat(); return; }
      if (!currentSession()) activeId = sessions[0].id;
      history = currentSession().messages;
      renderSessionList();
      renderActiveSession();
      input.focus();
    }).catch(function () { newChat(); });
  }

  /* ---------- 会话内消息检索 ---------- */
  function clearSearch() {
    var marks = messages.querySelectorAll('mark.search-hit');
    for (var i = marks.length - 1; i >= 0; i--) {
      var m = marks[i], t = document.createTextNode(m.textContent);
      m.parentNode.replaceChild(t, m);
    }
    Array.prototype.forEach.call(messages.querySelectorAll('.msg.search-active'), function (n) { n.classList.remove('search-active'); });
    messages.normalize();
    searchMatches = []; searchIndex = -1;
    var c = el('searchCount'); if (c) c.textContent = '';
  }
  function updateSearchUi() {
    var c = el('searchCount');
    if (!c) return;
    c.textContent = searchMatches.length ? (searchIndex + 1) + '/' + searchMatches.length : '';
  }
  function jumpSearch(i) {
    if (!searchMatches.length) return;
    searchIndex = ((i % searchMatches.length) + searchMatches.length) % searchMatches.length;
    Array.prototype.forEach.call(messages.querySelectorAll('.msg.search-active'), function (n) { n.classList.remove('search-active'); });
    var m = searchMatches[searchIndex];
    m.classList.add('search-active');
    m.scrollIntoView({ behavior: 'smooth', block: 'center' });
    updateSearchUi();
  }
  function updateModeBtn() {
    var btn = el('searchModeBtn');
    if (btn) { btn.textContent = searchMode === 'all' ? '全局' : '本会话'; btn.classList.toggle('on', searchMode === 'all'); }
  }
  function runSessionSearch(query) {
    var lower = query.toLowerCase();
    Array.prototype.forEach.call(messages.querySelectorAll('.msg'), function (msg) {
      var bubble = msg.querySelector('.bubble');
      if (!bubble || bubble.textContent.toLowerCase().indexOf(lower) < 0) return;
      searchMatches.push(msg);
      highlightText(bubble, lower);
    });
    if (searchMatches.length) jumpSearch(0);
    updateSearchUi();
  }
  function renderGlobalResults(query) {
    var lower = query.toLowerCase();
    var box = el('sessionList');
    if (!box) return;
    var results = [];
    sessions.forEach(function (s) {
      var cnt = 0;
      s.messages.forEach(function (m) {
        if (m.content && String(m.content).toLowerCase().indexOf(lower) >= 0) cnt++;
      });
      var titleHit = (s.title || '').toLowerCase().indexOf(lower) >= 0;
      if (cnt > 0 || titleHit) results.push({ s: s, cnt: cnt, titleHit: titleHit });
    });
    results.sort(function (a, b) { return (b.s.updatedAt || 0) - (a.s.updatedAt || 0); });
    box.innerHTML = '';
    if (!results.length) {
      var empty = document.createElement('div');
      empty.className = 'search-empty';
      empty.textContent = '没有匹配的会话';
      box.appendChild(empty);
    }
    results.forEach(function (r) {
      var s = r.s;
      var row = document.createElement('div');
      row.className = 'session' + (s.id === activeId ? ' active' : '') + ' search-result';
      row.innerHTML = '<div class="s-title"></div><div class="s-time"></div>';
      row.querySelector('.s-title').textContent = (r.titleHit ? '★ ' : '') + (s.title || '新对话');
      row.querySelector('.s-time').textContent = r.cnt + ' 条命中';
      row.addEventListener('click', function () {
        searchMode = 'session'; updateModeBtn();
        if (s.id !== activeId) { switchSession(s.id); }
        else { clearSearch(); renderSessionList(); renderActiveSession(); }
        runSessionSearch(query);
        input.focus();
      });
      box.appendChild(row);
    });
    var c = el('searchCount');
    if (c) c.textContent = results.length ? results.length + ' 个会话' : '';
  }
  function doSearch(q) {
    var query = String(q || '').trim();
    currentQuery = query;
    if (!query) { clearSearch(); renderSessionList(); updateSearchUi(); return; }
    if (searchMode === 'all') { clearSearch(); renderGlobalResults(query); }
    else { clearSearch(); runSessionSearch(query); }
  }
  function highlightText(root, lowerQ) {
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), tn, nodes = [];
    while ((tn = walker.nextNode())) {
      var p = tn.parentNode;
      if (!p || p.nodeType !== 1) continue;
      if (p.closest && p.closest('.mermaid, .think, mark, .approval-card, .auto-exec')) continue;
      if (tn.nodeValue.toLowerCase().indexOf(lowerQ) >= 0) nodes.push(tn);

  function stripToolMarkers(t) {

    // 2) DeepSeek DSML 工具调用整块（tool_calls / invoke / parameter 的闭合对）
    s = s.replace(/<\|DSML\|tool_calls\s*>[\s\S]*?<\/\|DSML\|tool_calls\s*>/g, '');
    s = s.replace(/<\|DSML\|invoke\s+name="[^"]*"\s*>[\s\S]*?<\/\|DSML\|invoke\s*>/g, '');
    s = s.replace(/<\|DSML\|parameter\s+name="[^"]*"\s+string="(?:true|false)"\s*>[\s\S]*?<\/\|DSML\|parameter\s*>/g, '');
    // 3) 残留的 DSML 标签 / 特殊控制 token（<|begin_of_sentence|> <|User|> <|Assistant|> <|end_of_sentence|> 等）
    s = s.replace(/<\/?\|DSML\|[^>]*>/g, '');
    s = s.replace(/<\/?\|[A-Za-z0-9_\u2581 ]{1,24}\|>/g, '');

    if (!file || !file.type || file.type.indexOf('image/') !== 0) return;
    if (file.size > 8 * 1024 * 1024) { alert('图片过大（超过 8MB），请压缩后重试'); return; }
    var reader = new FileReader();
    reader.onload = function () { pendingImage = { dataUrl: reader.result, name: file.name || '图片' }; renderImgPreview(); };
    reader.readAsDataURL(file);
  }

  function bindImageInputs() {
    var fileInput = el('imgFile');
    el('imgBtn').addEventListener('click', function () { fileInput.click(); });
    fileInput.addEventListener('change', function () { if (fileInput.files && fileInput.files[0]) attachImage(fileInput.files[0]); fileInput.value = ''; });
    document.addEventListener('paste', function (e) {
      var items = e.clipboardData && e.clipboardData.items;
      if (!items) return;
      for (var i = 0; i < items.length; i++) {
        if (items[i].type && items[i].type.indexOf('image/') === 0) { attachImage(items[i].getAsFile()); return; }
      }
    });
    document.addEventListener('dragover', function (e) { e.preventDefault(); });
    document.addEventListener('drop', function (e) { e.preventDefault(); if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) attachImage(e.dataTransfer.files[0]); });
  }

  /* ---------- 语音输入（Web Speech API） ---------- */
  function toggleVoice() {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert('当前环境不支持语音识别（需要联网的 Chromium 内核）'); return; }
    if (recognition) { recognition.stop(); recognition = null; el('micBtn').classList.remove('rec'); return; }
    recognition = new SR();
    recognition.lang = 'zh-CN';
    recognition.interimResults = true;
    recognition.continuous = false;
    recognition.onresult = function (e) {
      var t = '';
      for (var i = e.resultIndex; i < e.results.length; i++) t += e.results[i][0].transcript;
      input.value = t; autoGrow();
    };
    recognition.onend = function () { recognition = null; el('micBtn').classList.remove('rec'); };
    recognition.onerror = function () { recognition = null; el('micBtn').classList.remove('rec'); };
    recognition.start();
    el('micBtn').classList.add('rec');
  }

  /* ---------- 系统提示词：soul + 17 个研究 skill 清单 ---------- */
  function buildSystemPrompt() {
    var skills = [];
    try {
      var scan = IS_DESKTOP ? window.ingrid.scanSkillsSync() : null;
      if (scan && Array.isArray(scan.records)) {
        scan.records.forEach(function (r) {
          if ((r.boardIds || []).indexOf('research') >= 0 && r.enabled) {
            skills.push('- ' + r.name + '：' + r.description);
          }
        });
      }
    } catch (e) { /* 浏览器预览无扫描 */ }
    var extra = '';
    if (skills.length) {
      extra = '\n\n你具备以下研究能力（按需调用，始终遵循上面的铁律）：\n' + skills.join('\n');
    }
    if (upcomingDeadlinesCache.length) {
      var dl = upcomingDeadlinesCache.map(function (e) {
        return '- ' + (e.emoji || '') + ' [' + (e.categoryLabel || '日程') + '] ' + e.title + ' · ' + fmtDeadline(e) + (e.location ? ' · 📍' + e.location : '');
      }).join('\n');
      extra += '\n\n【你主人最近的研究日程（未来两周内到期）】\n' + dl +
        '\n当对话涉及这些事项、或用户请你做时间规划 / 排优先级 / 收尾时，主动提醒临近的截止日期，并给出轻重缓急建议。';
    }
    var caps = agentCapabilities();
    var s = systemPrompt + extra + toolSpecText(caps);
    if (writeAuthMode === 'session' && (caps.fs || caps.db)) {
      s += '\n\n【批量授权模式】用户已开启批量授权：你可以在一次回复里连续输出多个写操作工具（一次多个 <tool>），系统会全部自动执行，无需等待逐个确认。';
    }
    if (grillMode) {
      s += '\n\n【追问挑战模式】你此刻不是给答案的助手，而是苏格拉底式思维陪练。铁律：① 每次只问一个问题，聚焦用户陈述里最模糊、最薄弱或最值得怀疑的那一点；② 追问要逼出核心假设、关键变量、反例、边界条件与证据来源；③ 不急于给结论、方案或夸赞，除非用户明确请你收敛，否则持续追问；④ 可以引用用户原话反问，也可抛出一个反例或两难情境检验他的判断；⑤ 语气克制、犀利但不刻薄，一次只打一个点。';
    }
    s += '\n\n【输出格式】用 Markdown 排版：标题用 # / ##，重点加粗，善用列表、表格、引用；需要展示关系、流程或数据对比时，用 ```mermaid 代码块输出图表（flowchart 流程图、sequenceDiagram 时序图、pie 饼图、xychart-beta 柱状/折线图），不要用纯文字描述本可图示的内容。';
    return s;
  }

  /* ---------- 研究日历：即将到期日程（注入系统提示词，主动提醒） ---------- */
  var upcomingDeadlinesCache = [];
  function fmtDeadline(e) {
    var d = new Date(e.at);
    if (!isFinite(d.getTime())) return '';
    var hm = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + hm;
  }
  function refreshDeadlines() {
    if (!IS_DESKTOP || !window.ingrid.calendarUpcoming) { upcomingDeadlinesCache = []; return; }
    window.ingrid.calendarUpcoming(14).then(function (list) {
      upcomingDeadlinesCache = Array.isArray(list) ? list : [];
    }).catch(function () { upcomingDeadlinesCache = []; });
  }

  function loadEngines() {
    // 默认本地 Ollama；有 Key 的 API 引擎追加到下拉
    var opts = [
      { id: 'ollama', label: ENGINE_META.ollama.label },
      { id: 'ollama-vision', label: ENGINE_META['ollama-vision'].label },
    ];
    var preferred = null;
    function render() {
      engineSelect.innerHTML = '';
      opts.forEach(function (o) {
        var opt = document.createElement('option');
        opt.value = o.id; opt.textContent = o.label;
        engineSelect.appendChild(opt);
      });

          if (s && s[id]) {
            opts.push({ id: id, label: ENGINE_META[id].label });
            if (!preferred) preferred = id; // 第一个已配 key 的 API 引擎优先
          }
        });
        render();
      }).catch(function () { render(); });
    } else {
      render();
    }
  }

  // 模型下拉：随引擎切换更新，带用途说明；记住上次选择
  function currentModelMeta() {
    var engine = engineSelect.value || 'ollama';
    var list = ENGINE_MODELS[engine] || ENGINE_MODELS.ollama || [];
    var id = modelSelect && modelSelect.value;
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return list[0] || { id: id, label: id, desc: '' };
  }
  function updateModelHint() {
    var m = currentModelMeta();
    if (modelSelect) modelSelect.title = m.desc;
    var h = el('modelHint');
    if (h) { h.textContent = m.desc; h.title = m.desc; }
  }
  function loadModels(engine) {
    var list = ENGINE_MODELS[engine] || ENGINE_MODELS.ollama || [];
    modelSelect.innerHTML = '';
    list.forEach(function (m) {
      var opt = document.createElement('option');
      opt.value = m.id; opt.textContent = m.label; opt.title = m.desc;
      modelSelect.appendChild(opt);
    });
    var saved = null; try { saved = localStorage.getItem('rc_model_' + engine); } catch (e) {}
    if (saved) {
      for (var i = 0; i < list.length; i++) if (list[i].id === saved) { modelSelect.value = saved; break; }
    }
    updateModelHint();
  }
  engineSelect.addEventListener('change', function () {
    loadModels(engineSelect.value || 'ollama');
    try { localStorage.setItem('rc_model_' + (engineSelect.value || 'ollama'), modelSelect.value); } catch (e) {}
  });
  modelSelect.addEventListener('change', function () {
    updateModelHint();
    try { localStorage.setItem('rc_model_' + (engineSelect.value || 'ollama'), modelSelect.value); } catch (e) {}
  });
  function currentModelId() { return (modelSelect && modelSelect.value) || ''; }
  function defaultModelId(engine) {
    var list = ENGINE_MODELS[engine] || ENGINE_MODELS.ollama || [];
    return (list[0] && list[0].id) || '';
  }

  /* ---------- 知识库（本地 RAG） ---------- */
  var kbEnabled = true;
  var webEnabled = false;  // 联网搜索开关（研究助手默认关，保持「只依据证据」）
  var reviewMode = false;  // 审稿闭环开关
  var grillMode = false;   // 追问挑战开关（苏格拉底式连环追问）

  function renderKbStatus(s) {
    var badge = el('kbBadge'), statusEl = el('kbStatus');
    if (!s) return;
    badge.textContent = s.totalChunks ? (s.totalChunks + ' 片段') : '–';
    var lines = [];
    if (s.totalChunks) {
      lines.push('已索引 ' + s.totalFiles + ' 篇笔记 / ' + s.totalChunks + ' 个片段');
      lines.push(s.embedReady
        ? '<span class="ok">✓ 语义检索就绪（' + s.embedModel + '）</span>'
        : '<span class="warn">⚠ 语义模型未就绪，暂用关键词检索；模型就绪后点「重建索引」升级</span>');
    } else {
      lines.push('尚无内容：把笔记放进 Obsidian 库即可自动收录并更新');
    }
    if (s.sources && s.sources.length) {
      lines.push('源：' + s.sources.map(function (x) { return x.label; }).join('、'));
    }

  }

  function loadKbStatus() {
    if (!IS_DESKTOP) return;
    window.ingrid.kbStatus().then(renderKbStatus).catch(function () { el('kbStatus').textContent = '知识库不可用'; });
  }

  /* ---------- 渲染消息 ---------- */
  function addBubble(role, html) {
    var wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    wrap.innerHTML = avatarHtml(role) + '<div class="bubble">' + html + '</div>';
    if (role === 'assistant') {
      var cb = document.createElement('button');
      cb.className = 'copy-btn';
      cb.title = '复制回答';
      cb.textContent = '复制';
      cb.addEventListener('click', function () { copyBubbleText(wrap.querySelector('.bubble'), cb); });
      wrap.appendChild(cb);
    }
    messages.appendChild(wrap);
    messages.scrollTop = messages.scrollHeight;
    return wrap.querySelector('.bubble');
  }
  function fallbackCopyText(text) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }
  function flashCopy(btn) {
    if (!btn) return;
    var o = btn.textContent; btn.textContent = '✓ 已复制';
    setTimeout(function () { btn.textContent = o; }, 1200);
  }
  function copyBubbleText(bubble, btn) {
    var clone = bubble.cloneNode(true);
    Array.prototype.forEach.call(clone.querySelectorAll('.think, .cursor, .copy-btn'), function (n) { n.remove(); });
    var text = clone.textContent.replace(/\n{3,}/g, '\n\n').trim();
    if (!text) return;
    var done = function () { flashCopy(btn); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallbackCopyText(text); done(); });
    } else { fallbackCopyText(text); done(); }
  }
  function welcome() {
    var hints = [
      '帮我把这个想法提炼成一个可检验的研究问题',
      '拆解这篇论文的研究问题、方法与局限',
      '给我写一段文献综述的开头',
      '我的研究设计有哪些替代解释没排除',
    ];
    var html = '<div class="welcome">' +
      '<div class="big">' + window.iconSvg('grad') + '</div>' +
      '<h2>研究助手 · 随时可问</h2>' +
      '<p>挂 Research 板块 17 个研究 skill，覆盖从想法到论文的全程</p>' +
      '<div class="hints">' + hints.map(function (h) { return '<span class="hint">' + h + '</span>'; }).join('') + '</div>' +
      '</div>';
    messages.innerHTML = html;
    Array.prototype.forEach.call(messages.querySelectorAll('.hint'), function (n) {
      n.addEventListener('click', function () { input.value = n.textContent; input.focus(); autoGrow(); });
    });
  }

  /* ---------- 发送 ---------- */
  function autoGrow() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  }

  function send() {
    var text = input.value.trim();
    var img = pendingImage;
    if ((!text && !img) || streaming) return;
    stopRequested = false;   // 新一轮，重置停止标志
    input.value = ''; autoGrow();
    pendingImage = null; renderImgPreview();

    // 带图片时：自动切到支持图片的视觉引擎（DeepSeek / Qwen / 本地文本模型均不支持图片输入）
    var engine = engineSelect.value || 'ollama';
    var model = modelSelect.value || '';
    var imgEngineNote = '';
    if (img && engine !== 'ollama-vision' && engine !== 'gpt') {
      engine = 'ollama-vision'; model = defaultModelId('ollama-vision');
      imgEngineNote = '<div class="engine-note">📷 当前引擎不支持图片，已自动切换到本地视觉模型（qwen2.5vl:7b）</div>';
    }

    // 清掉欢迎态
    if (messages.querySelector('.welcome')) messages.innerHTML = '';

    // 用户气泡（含图片缩略 + 引擎切换提示）
    var userHtml = '';
    if (img) userHtml += '<div class="user-img"><img src="' + img.dataUrl + '"></div>';
    userHtml += esc(text || (img ? '（发送了一张图片）' : ''));
    userHtml += imgEngineNote;
    addBubble('user', userHtml);

    // 审稿闭环模式：产出 → 审稿 → 返修（独立多气泡渲染）
    if (reviewMode && IS_DESKTOP) {
      streaming = true; setSendBtnState(true);
      withKbContext(text, function (content) {
        sendReviewLoop(content, engineSelect.value || 'ollama');
      });
      return;
    }

    // 助手气泡（流式填充）
    var bubble = addBubble('assistant', '<span class="cursor"></span>');
    var acc = '';
    var thinking = '';
    var live = '';
    var statusText = '正在思考…';   // 当前状态提示（首字延迟 / 工具调用往返）
    streaming = true; setSendBtnState(true);

    // engine / model 已在上面确定（含图片自动切换逻辑）

    function statusHtml(txt) {
      return '<div class="status-line">' + esc(txt) + '<span class="dots"><i></i><i></i><i></i></span></div>';
    }
    function renderStream() {
      var thinkHtml = thinking
        ? '<details class="think" open><summary>思考过程</summary>' + esc(thinking) + '</details>'
        : '';
      // 还没出正文时，给用户一个明确的「在干什么」提示
      var status = (!acc && !live) ? statusHtml(statusText) : '';
      bubble.innerHTML = thinkHtml + status + (acc ? mdToHtml(acc) : '') + (live ? mdToHtml(live) : '') + '<span class="cursor"></span>';
      messages.scrollTop = messages.scrollHeight;
    }
    // 首字延迟期间先显示状态（用户点发送后立刻有反馈）
    renderStream();

    function finish(finalText, err) {
      history.push({ role: 'user', content: text || (img ? '（图片）' : '') });
      if (finalText) history.push({ role: 'assistant', content: finalText });
      while (history.length > 24) history.shift();
      touchCurrentSession();
      autoTitle(currentSession());
      persistSessions();
      renderSessionList();
      var thinkHtml = thinking
        ? '<details class="think"' + (finalText && !err ? '' : ' open') + '><summary>思考过程</summary>' + esc(thinking) + '</details>'
        : '';
      bubble.innerHTML = thinkHtml + (err
        ? '<span class="err">' + esc((finalText || '') + (finalText ? '\n\n' : '') + '⚠️ ' + err) + '</span>'
        : mdToHtml(finalText || '（无回复）'));
      bubble.classList.remove('err');
      if (err) bubble.classList.add('err');
      if (!err) renderMermaidIn(bubble);
      streaming = false; setSendBtnState(false);
      input.focus();
    }

    function run(content) {
      var prompt = content || (img ? '请分析这张图片。' : '');
      var userMsg = { role: 'user', content: prompt };
      if (img) {
        userMsg.content = [
          { type: 'text', text: prompt },
          { type: 'image_url', image_url: { url: img.dataUrl } },
        ];
      }
      var reqMessages = [{ role: 'system', content: buildSystemPrompt() }]
        .concat(history.slice(-12))
        .concat([userMsg]);

      if (!IS_DESKTOP) {
        // 浏览器预览：无后端，模拟一段回复
        finish('（浏览器预览模式：无法调用模型。请用桌面应用运行，并在主界面「引擎设置」配置 Key 或保持本地 Ollama。）');
        return;
      }

      function runToolTurn(msgs, round, contN) {
        live = '';
        window.ingrid.chatStream({ engine: engine, model: model, messages: msgs }, {
          onDelta: function (chunk) {
            if (chunk && chunk.thinking) thinking += chunk.thinking;
            if (chunk && chunk.text) live += chunk.text;
            renderStream();
          },
          onDone: function (d) {
            var rawRound = live;
            if (stopRequested) { finish(acc + stripToolMarkers(rawRound), '已手动停止'); return; }
            if (d && !d.ok) { finish(acc + stripToolMarkers(rawRound), d && d.error); return; }
            var calls = extractToolCalls(rawRound);
            if (calls.length && round < MAX_TOOL_ROUNDS) {
              // 中间轮：叙述 + 工具调用记录折叠进「思考过程」，不累进正文，
              // 避免模型每轮重复叙述导致最终答案出现重复段落
              var narrate = stripToolMarkers(rawRound).trim();
              var trace = (narrate ? narrate + '\n' : '') + '[已使用工具 ' + calls.map(function (c) { return c.name; }).join('、') + ']';
              thinking += (thinking ? '\n\n' : '') + trace;
              live = '';
              statusText = '正在使用工具 ' + calls.map(function (c) { return c.name; }).join('、') + '…';
              renderStream();
              var caps = agentCapabilities();
              Promise.all(calls.map(function (c) {
                return executeTool(c, caps).then(function (r) { return formatToolResult(c, r); });
              })).then(function (results) {
                statusText = '正在思考…';
                renderStream();
                var next = msgs.concat([{ role: 'assistant', content: rawRound }])
                  .concat([{ role: 'user', content: results.join('\n\n') }]);
                runToolTurn(next, round + 1, 0);
              }).catch(function () { finish(acc + stripToolMarkers(rawRound), '工具执行失败，已停止'); });
            } else {
              acc += stripToolMarkers(rawRound);
              var c = contN || 0;
              if (d && d.truncated && c < 3) {
                // 被 max_tokens 截断：自动续写，直到自然结束或续写 3 次封顶
                var contMsgs = msgs.concat([{ role: 'assistant', content: rawRound }])
                  .concat([{ role: 'user', content: '（继续，紧接上文接着写，不要重复已写内容）' }]);
                statusText = '内容较长，继续生成…';
                live = '';
                renderStream();
                runToolTurn(contMsgs, round, c + 1);
                return;
              }
              finish(acc);
            }
          },
        });
      }

      runToolTurn(reqMessages, 0);
    }

    // 上下文注入：本地知识库 RAG + 联网搜索（按开关组合）
    withContext(text, function (content) { run(content); });
  }

  /* ---------- 知识库上下文注入（审稿闭环用，只本地证据不联网） ---------- */
  function withKbContext(text, cb) {
    if (kbEnabled && IS_DESKTOP) {
      window.ingrid.kbSearch(text, 4).then(function (hits) {
        if (hits && hits.length) {
          var ctx = hits.map(function (h, i) {
            return '[' + (i + 1) + '] ' + h.title + '（' + h.source + ' / ' + h.relPath + '）\n' + h.content;
          }).join('\n\n');
          cb('【本地知识库 · 相关片段，仅作证据参考，与问题无关则忽略】\n' + ctx + '\n\n【用户问题】\n' + text);
        } else { cb(text); }
      }).catch(function () { cb(text); });
    } else { cb(text); }
  }

  /* ---------- 上下文注入（普通聊天用：知识库 + 联网搜索） ---------- */
  function withContext(text, cb) {
    if (!IS_DESKTOP) { cb(text); return; }
    var ps = [];
    if (kbEnabled) {
      ps.push(window.ingrid.kbSearch(text, 4).then(function (hits) {
        if (hits && hits.length) {
          return '【本地知识库 · 相关片段，仅作证据参考，与问题无关则忽略】\n' +
            hits.map(function (h, i) { return '[' + (i + 1) + '] ' + h.title + '（' + h.source + ' / ' + h.relPath + '）\n' + h.content; }).join('\n\n');
        }
        return '';
      }).catch(function () { return ''; }));
    }
    if (webEnabled) {
      ps.push(window.ingrid.webSearch({ query: text, n: 4 }).then(function (r) {
        if (r && r.ok && r.results && r.results.length) {
          return '【联网搜索结果 · 仅作参考，与问题无关则忽略，回答时标注来源】\n' +
            r.results.map(function (x, i) { return '[' + (i + 1) + '] ' + x.title + '\n' + x.link + '\n' + (x.snippet || ''); }).join('\n\n');
        }
        return '';
      }).catch(function () { return ''; }));
    }
    // Notion 知识库（已配 token 才搜到；未配时快速失败，静默跳过）
    if (window.ingrid.notionSearch) {
      ps.push(window.ingrid.notionSearch(text).then(function (r) {
        if (r && r.ok && r.results && r.results.length) {
          return '【Notion 知识库 · 相关页面，仅作参考，与问题无关则忽略】\n' +
            r.results.map(function (x, i) { return '[' + (i + 1) + '] ' + x.title + '（' + (x.object === 'database' ? '数据库' : '页面') + '）'; }).join('\n');
        }
        return '';
      }).catch(function () { return ''; }));
    }
    if (!ps.length) { cb(text); return; }
    Promise.all(ps).then(function (ctxs) {
      var ctx = ctxs.filter(Boolean).join('\n\n');
      cb(ctx ? ctx + '\n\n【用户问题】\n' + text : text);
    });
  }

  /* ---------- 审稿闭环：产出 → 审稿 → 返修 ---------- */
  function sendReviewLoop(text, engine) {
    var bubble = null;       // 当前正文气泡（初稿 / 修订版）
    var reviewEl = null;     // 当前审稿意见块
    var curText = '', curThink = '';

    function render() {
      if (bubble) {
        var thinkHtml = curThink ? '<details class="think" open><summary>思考过程</summary>' + esc(curThink) + '</details>' : '';
        bubble.innerHTML = bubble._tag + thinkHtml + (curText ? mdToHtml(curText) : '') + '<span class="cursor"></span>';
      } else if (reviewEl) {
        reviewEl.innerHTML = reviewEl._summary + (curText ? mdToHtml(curText) : '') + '<span class="cursor"></span>';
      }
      messages.scrollTop = messages.scrollHeight;
    }

    function close() {
      if (bubble) {
        var thinkHtml = curThink ? '<details class="think"><summary>思考过程</summary>' + esc(curThink) + '</details>' : '';
        bubble.innerHTML = bubble._tag + thinkHtml + (curText ? mdToHtml(curText) : '');
        renderMermaidIn(bubble);
      } else if (reviewEl) {
        reviewEl.innerHTML = reviewEl._summary + (curText ? mdToHtml(curText) : '');
        renderMermaidIn(reviewEl);
      }
      bubble = null; reviewEl = null; curText = ''; curThink = '';
    }

    var reqMessages = [{ role: 'system', content: buildSystemPrompt() }]
      .concat(history.slice(-12))
      .concat([{ role: 'user', content: text }]);

    window.ingrid.reviewLoop({ engine: engine, model: currentModelId(), messages: reqMessages, rounds: 2 }, {
      onPhase: function (d) {
        close();
        if (d.phase === 'draft') {
          bubble = addBubble('assistant', '');
          bubble._tag = '<span class="phase-tag draft">初稿</span>';
          render();
        } else if (d.phase === 'revise') {
          bubble = addBubble('assistant', '');
          bubble._tag = '<span class="phase-tag revise">修订版 · 第 ' + d.round + ' 轮</span>';
          render();
        } else if (d.phase === 'review') {
          var wrap = document.createElement('div');
          wrap.className = 'msg assistant';
          wrap.innerHTML = avatarHtml('assistant') + '<div class="bubble"><div class="review-block"><details open><summary>审稿人意见 · 第 ' + d.round + ' 轮</summary></details></div></div>';
          messages.appendChild(wrap);
          reviewEl = wrap.querySelector('details');
          reviewEl._summary = '<summary>审稿人意见 · 第 ' + d.round + ' 轮</summary>';
          render();
        }
      },
      onDelta: function (txt, think) {
        if (stopRequested) return;
        if (txt) curText += txt;
        if (think) curThink += think;
        render();
      },
      onDone: function (d) {
        close();
        if (stopRequested) {
          var s2 = document.createElement('div');
          s2.className = 'loop-status';
          s2.textContent = '⚙ 已手动停止';
          messages.appendChild(s2);
          messages.scrollTop = messages.scrollHeight;
          streaming = false; setSendBtnState(false);
          input.focus();
          return;
        }
        history.push({ role: 'user', content: text });
        if (d && d.finalText) history.push({ role: 'assistant', content: d.finalText });
        while (history.length > 24) history.shift();
        touchCurrentSession();
        persistSessions();
        renderSessionList();
        var status = document.createElement('div');
        status.className = 'loop-status';
        if (d && d.ok) {
          var engLabel = { 'ollama': '本地 qwen3:32b', 'ollama-review': '本地 r1:32b', 'deepseek': 'DeepSeek', 'gpt': 'GPT', 'qwen': 'Qwen' };
          status.textContent = '⚙ 审稿闭环 · ' + (d.passed ? '审稿人判定「通过」，无需再改' : '完成 ' + (d.rounds || 2) + ' 轮审稿返修') + '（干活 ' + (engLabel[d.engine] || d.engine || '') + ' / 审稿 ' + (engLabel[d.reviewer] || d.reviewer || '') + '）';
        } else {
          status.textContent = '⚙ 审稿闭环中断：' + (d && d.error ? d.error : '未知错误');
        }
        messages.appendChild(status);
        messages.scrollTop = messages.scrollHeight;
        streaming = false; setSendBtnState(false);
        input.focus();
      },
    });
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  /* ---------- 事件 ---------- */
  sendBtn.addEventListener('click', function () {
    if (streaming) { stopGeneration(); } else { send(); }
  });
  bindImageInputs();
  el('micBtn').addEventListener('click', toggleVoice);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  input.addEventListener('input', autoGrow);
  el('clearBtn').addEventListener('click', newChat);

  // 新对话 + 会话内检索
  el('newChatBtn').addEventListener('click', newChat);
  var searchInput = el('searchInput');
  searchInput.addEventListener('input', function () { doSearch(searchInput.value); });
  searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); jumpSearch(e.shiftKey ? searchIndex - 1 : searchIndex + 1); }
  });
  el('searchPrev').addEventListener('click', function () { jumpSearch(searchIndex - 1); });
  el('searchNext').addEventListener('click', function () { jumpSearch(searchIndex + 1); });
  el('searchModeBtn').addEventListener('click', function () {
    searchMode = searchMode === 'all' ? 'session' : 'all';
    updateModeBtn();
    doSearch(currentQuery);
  });
  el('backupBtn').addEventListener('click', function () {
    if (!IS_DESKTOP) { alert('浏览器预览模式无法备份，请用桌面应用'); return; }
    window.ingrid.chatBackup().then(function (r) {
      if (r && r.ok) alert('已备份 ' + r.count + ' 个会话文件到：\n' + r.path);
      else alert('备份失败：' + ((r && r.error) || '未知错误'));
    }).catch(function (e) { alert('备份失败：' + String(e && e.message || e)); });
  });

  // 批量授权开关
  el('batchAuthBtn').addEventListener('click', function () {
    setBatchAuth(writeAuthMode !== 'session');
  });

  // 联网搜索开关
  el('webBtn').addEventListener('click', function () {
    webEnabled = !webEnabled;
    el('webBtn').classList.toggle('active', webEnabled);
  });

  // 审稿闭环开关
  el('reviewBtn').addEventListener('click', function () {
    reviewMode = !reviewMode;
    if (reviewMode) { grillMode = false; el('grillBtn').classList.remove('active'); }
    el('reviewBtn').classList.toggle('active', reviewMode);
    el('footNote').textContent = reviewMode
      ? '审稿闭环：产出 → 审稿 → 返修（2 轮），干活与审稿用不同引擎'
      : '本地 Ollama 免费 · 云端 API 需先在主界面「引擎设置」配 Key';
  });

  // 追问挑战开关
  el('grillBtn').addEventListener('click', function () {
    grillMode = !grillMode;
    if (grillMode) { reviewMode = false; el('reviewBtn').classList.remove('active'); }
    el('grillBtn').classList.toggle('active', grillMode);
    el('footNote').textContent = grillMode
      ? '追问挑战：不直接给答案，连环追问逼你理清假设与边界'
      : '本地 Ollama 免费 · 云端 API 需先在主界面「引擎设置」配 Key';
  });

  // 导出当前对话为 Markdown
  function exportMarkdown() {
    var s = currentSession();
    if (!s || !s.messages.length) { alert('当前对话还没有内容'); return; }
    var title = (s.title && s.title !== '新对话') ? s.title : '研究助手对话';
    var lines = ['# ' + title, ''];
    s.messages.forEach(function (m) {
      var who = m.role === 'user' ? '我' : '研究助手';
      lines.push('## ' + who, '');
      lines.push((m.role === 'assistant' ? stripToolMarkers(m.content) : (m.content || '')) || '', '');
    });
    var md = lines.join('\n');
    if (!IS_DESKTOP) { alert('浏览器预览模式无法导出，请用桌面应用'); return; }
    window.ingrid.docGenerate({ type: 'md', title: title, content: md }).then(function (r) {
      if (r && r.ok) alert('已导出：\n' + r.path);
      else alert('导出失败：' + ((r && r.error) || '未知错误'));
    }).catch(function (e) { alert('导出失败：' + String(e && e.message || e)); });
  }
  el('mdBtn').addEventListener('click', exportMarkdown);

  // 知识库交互
  el('kbBtn').addEventListener('click', function () {
    var p = el('kbPanel');
    p.hidden = !p.hidden;
    if (!p.hidden) loadKbStatus();
  });
  el('kbToggle').addEventListener('change', function () { kbEnabled = el('kbToggle').checked; });
  el('kbRescan').addEventListener('click', function () {
    var btn = el('kbRescan');
    btn.disabled = true; btn.textContent = '索引中…';
    window.ingrid.kbScan().then(function () {
      btn.disabled = false; btn.textContent = '重建索引';
      loadKbStatus();
    }).catch(function () { btn.disabled = false; btn.textContent = '重建索引'; });
  });

  /* ---------- 启动 ---------- */
  setLogo();
  loadSoul();
  loadEngines();
  loadSessions();
  loadKbStatus();
  applySidebarWidth();
  initSidebarResize();
  updateModeBtn();
  refreshDeadlines();
  setInterval(refreshDeadlines, 5 * 60 * 1000);   // 每 5 分钟刷新一次到期日程
  input.focus();
})();
</script>
